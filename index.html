<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📖 小说阅读器</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* 配图提示词隐藏/显示 */
        .content-area .prompt-text {
            display: none;
            font-size: 13px;
            color: #aaa;
            padding: 8px 12px;
            background: #0f0f1a;
            border-radius: 4px;
            border-left: 3px solid #ffd866;
            margin-top: 6px;
            line-height: 1.8;
            word-break: break-word;
        }
        .content-area .prompt-text div {
            margin: 2px 0;
        }
        .content-area.show-prompts .prompt-text {
            display: block !important;
        }
        .content-area .scene-image {
            position: relative;
        }
        .content-area .scene-image img {
            max-width: 100%;
            border-radius: 8px;
            border: 1px solid #2a2a4a;
        }
        /* 配图分隔线 */
        .content-area .image-divider {
            border: none;
            border-top: 1px solid #2a2a4a;
            margin: 16px 0;
            opacity: 0.4;
        }

        /* 阅读器外观：字号 / 主题 */
        * { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
        .content-area .chapter-content {
            font-size: var(--reader-font-size, 17px);
            line-height: 2;
            transition: font-size .15s ease;
            color: var(--reader-color, inherit);
            font-family: var(--reader-font-family, inherit);
        }
        .content-area .chapter-content p, .content-area .chapter-content div, .content-area .chapter-content span {
            font-size: inherit;
            color: inherit;
            font-family: inherit;
        }
        body.theme-day { background: #f5f1e8; }
        body.theme-day .main-content, body.theme-day .content-area { background: #faf7f0; color: #2c2a26; }
        body.theme-day .chapter-title { color: #5a4a2a; }
        body.theme-sepia { background: #e8dcc0; }
        body.theme-sepia .main-content, body.theme-sepia .content-area { background: #efe6cc; color: #3a2f1a; }
        body.theme-sepia .chapter-title { color: #6b4f20; }
        .reader-toolbar button {
            padding: 4px 10px; font-size: 12px; cursor: pointer;
            background: #2a2a4a; color: #c0c0d0; border: 1px solid #2a2a4a; border-radius: 5px;
        }
        .reader-toolbar button:hover { background: #3a3a5a; }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- ====== 左侧边栏 ====== -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>📚 章节列表</h2>
                <span class="badge" id="chapterCount">0 章</span>
            </div>
            <div id="novelSelector" style="padding:8px 12px;border-bottom:1px solid #2a2a4a;">
                <select id="novelSelect" style="width:100%;padding:6px;background:#1a1a2e;color:#e0e0e0;border:1px solid #3a3a5e;border-radius:6px;font-size:13px;"></select>
                <div style="display:flex;gap:6px;margin-top:6px;">
                    <button id="newNovelBtn" style="flex:1;font-size:12px;padding:4px;background:#2a2a4a;color:#4ade80;border:1px solid #4ade80;border-radius:5px;cursor:pointer;">➕ 新建</button>
                    <button id="renameNovelBtn" style="flex:1;font-size:12px;padding:4px;background:#2a2a4a;color:#ffd866;border:1px solid #ffd866;border-radius:5px;cursor:pointer;">✏️ 重命名</button>
                    <button id="delNovelBtn" style="flex:1;font-size:12px;padding:4px;background:#2a2a4a;color:#f87171;border:1px solid #f87171;border-radius:5px;cursor:pointer;">🗑️ 删除</button>
                </div>
                <div style="display:flex;gap:6px;margin-top:6px;">
                    <button id="roleCardsBtn" style="flex:1;font-size:12px;padding:5px;background:#2a2a4a;color:#e9d5ff;border:1px solid #a78bfa;border-radius:5px;cursor:pointer;">👤 角色设定</button>
                    <button id="charactersBtn" style="flex:1;font-size:12px;padding:5px;background:#2a2a4a;color:#7dd3fc;border:1px solid #38bdf8;border-radius:5px;cursor:pointer;">🧑 人物库</button>
                </div>
                <div style="display:flex;gap:6px;margin-top:6px;">
                    <button id="exportNovelBtn" style="flex:1;font-size:12px;padding:5px;background:#2a2a4a;color:#4ade80;border:1px solid #4ade80;border-radius:5px;cursor:pointer;">📤 导出</button>
                    <button id="importNovelBtn" style="flex:1;font-size:12px;padding:5px;background:#2a2a4a;color:#60a5fa;border:1px solid #60a5fa;border-radius:5px;cursor:pointer;">📥 导入</button>
                    <input type="file" id="importNovelFile" accept=".json,application/json" style="display:none;">
                </div>
            </div>
            <div class="chapter-list-sidebar" id="chapterListSidebar">
                <div class="empty-state" style="padding:40px 20px;font-size:14px;">
                    <div>📭 暂无章节</div>
                    <p style="margin-top:8px;font-size:13px;color:#555;">点击「导入小说」解析 TXT</p>
                </div>
            </div>
            <div class="sidebar-footer">
                <button class="primary-btn" id="importBtn">📥 导入小说</button>
                <button id="expandAllBtn">展开全部</button>
                <button id="collapseAllBtn">收起全部</button>
            </div>
        </aside>

        <!-- ====== 主内容区 ====== -->
        <main class="main-content">
            <div class="main-header">
                <div class="title-area">
                    <button id="hamburgerBtn" title="章节列表">☰</button>
                    <h1 id="mainTitle">📖 小说阅读器</h1>
                    <span class="chapter-num" id="chapterNum">第 0 章</span>
                </div>
                <div class="actions">
                    <button id="prevBtn" title="上一章">◀ 上一章</button>
                    <button id="nextBtn" title="下一章">下一章 ▶</button>
                    <button class="primary" id="addImageBtn">🖼️ 手动配图</button>
                    <button id="aiImageBtn" style="background:#7c3aed;color:white;border:1px solid #7c3aed;font-weight:bold;">✨ AI 自动配图</button>
                    <button id="aiStopBtn" style="display:none;background:#f87171;color:white;border:1px solid #f87171;font-weight:bold;">⏹ 终止</button>
                    <input id="maxScenesInput" type="number" min="1" max="20" value="5" title="每章最多生成几张图" style="width:50px;padding:4px 6px;background:#2a2a4a;color:#e0e0e0;border:1px solid #2a2a4a;border-radius:5px;font-size:12px;text-align:center;">
                    <button id="currentEngineBtn" title="点击切换生图引擎" style="background:#14142a;color:#ffd866;border:1px solid #ffd866;font-size:12px;padding:4px 10px;border-radius:12px;cursor:pointer;">🎨 ComfyUI</button>
                    <button id="fontDecBtn" onclick="window._decSize&&window._decSize()" title="缩小字号" style="background:#2a2a4a;color:#e0e0e0;border:1px solid #3a3a5e;padding:4px 8px;border-radius:5px;font-size:13px;">A-</button>
                    <button id="fontIncBtn" onclick="window._incSize&&window._incSize()" title="放大字号" style="background:#2a2a4a;color:#e0e0e0;border:1px solid #3a3a5e;padding:4px 8px;border-radius:5px;font-size:13px;">A+</button>
                    <button id="fontFamilyBtn" onclick="cycleFont()" title="切换字体（长按导入自定义字体）" style="background:#2a2a4a;color:#e0e0e0;border:1px solid #3a3a5e;padding:4px 8px;border-radius:5px;font-size:13px;">🔤 字体</button>
                    <button id="fontColorBtn" onclick="cycleColor()" title="设置字体颜色" style="background:#2a2a4a;color:#e0e0e0;border:1px solid #3a3a5e;padding:4px 8px;border-radius:5px;font-size:13px;">🎨 字色</button>
                    <button id="themeBtn" title="切换阅读主题" style="background:#2a2a4a;color:#e0e0e0;border:1px solid #3a3a5e;padding:4px 8px;border-radius:5px;font-size:13px;">🌙 夜间</button>
                    <button id="bgBtn" title="设置背景图" style="background:#2a2a4a;color:#e0e0e0;border:1px solid #3a3a5e;padding:4px 8px;border-radius:5px;font-size:13px;">🖼️ 背景</button>
                    <button id="readToggleBtn" onclick="toggleRead(currentIndex)" title="标记已读/未读" style="background:#2a2a4a;color:#e0e0e0;border:1px solid #3a3a5e;padding:4px 8px;border-radius:5px;font-size:13px;">⭕ 未读</button>
                    <input type="file" id="bgFile" accept="image/*" style="display:none;">
                    <button id="toolsToggleBtn" style="background:#2a2a4a;color:#888;border:1px solid #888;">🛠️ ▾</button>
                    <span id="secondaryTools" style="display:none;flex-wrap:wrap;gap:4px;width:100%;margin-top:4px;">
                    <button id="togglePromptsBtn" style="background:#2a2a4a;color:#888;border:1px solid #888;">👁️ 显示提示词</button>
                    <button id="aiIllustratorBtn" style="background:#2a2a4a;color:#ffd866;border:1px solid #ffd866;">🎨 配图工具</button>
                    <button onclick="location.href='/stats.html'" style="background:#2a2a4a;color:#60a5fa;border:1px solid #60a5fa;">📊 统计</button>
                    </span>
                    <button id="moreToolsBtn" style="background:#2a2a4a;color:#888;border:1px solid #888;">⚙️ 更多 ▾</button>
                    <span id="moreToolsGroup" style="display:none;flex-wrap:wrap;gap:6px;width:100%;margin-top:4px;">
                        <button id="comfyConfigBtn" style="background:#2a2a4a;color:#ffd866;border:1px solid #ffd866;">⚙️ ComfyUI配置</button>
                        <button id="apiConfigBtn" style="background:#2a2a4a;color:#ffd866;border:1px solid #ffd866;">⚙️ API配置</button>
                        <button id="comfyTestBtn" style="background:#2a2a4a;color:#4ade80;border:1px solid #4ade80;">🧪 测试</button>
                        <button id="novelaiTestBtn" style="background:#2a2a4a;color:#ff6b9d;border:1px solid #ff6b9d;">🎨 NovelAI</button>
                        <button id="novelaiApiBtn" style="background:#2a2a4a;color:#ff6b9d;border:1px solid #ff6b9d;">🎨 NovelAI-蛋糕</button>
                        <button onclick="location.href='/gen-log.html'" style="background:#2a2a4a;color:#86efac;border:1px solid #86efac;">📜 生图日志</button>
                    </span>
                </div>
            </div>

            <div class="content-area" id="contentArea">
                <div class="empty-state">
                    <span class="icon">📚</span>
                    <h2>欢迎使用小说阅读器</h2>
                    <p>点击左侧「导入小说」按钮，上传 TXT 文件开始阅读</p>
                </div>
            </div>
        </main>
    </div>

    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <!-- AI 进度浮层 -->
    <div id="aiProgressPanel" style="display:none;position:fixed;right:16px;bottom:16px;z-index:2000;background:#1a1410;border:1px solid #ffd866;border-radius:10px;min-width:260px;box-shadow:0 4px 20px rgba(0,0,0,0.5);font-size:13px;">
        <div style="display:flex;align-items:center;gap:8px;padding:10px 14px 4px;cursor:pointer;" onclick="toggleAiProgress()" title="点击收起/展开">
            <span style="color:#ffd866;font-weight:bold;flex:1;">⏳ <span id="aiProgressTitle">处理中...</span></span>
            <span id="aiCollapseBtn" style="font-size:14px;color:#888;cursor:pointer;user-select:none;">—</span>
        </div>
        <div id="aiProgressLog" style="color:#aaa;line-height:1.9;max-height:200px;overflow-y:auto;font-size:12px;padding:0 14px 14px;"></div>
    </div>
    <!-- AI 进度收起后的恢复按钮 -->
    <button id="aiProgressRestore" onclick="toggleAiProgress()" style="display:none;position:fixed;right:16px;bottom:16px;z-index:2000;background:#7c3aed;color:#fff;border:none;border-radius:50%;width:48px;height:48px;font-size:20px;cursor:pointer;box-shadow:0 4px 16px rgba(124,58,237,0.5);" title="展开配图进度">🎨</button>

    <!-- ====== 导入模态框 ====== -->
    <div class="modal-overlay" id="importModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">📥 导入小说</h3>
                <button class="close-btn" id="closeModalBtn">✕</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <!-- ====== 人物库模态框 ====== -->
    <div class="modal-overlay" id="charModal">
        <div class="modal-content" style="width:min(720px,94vw);max-height:90vh;display:flex;flex-direction:column;">
            <div class="modal-header">
                <h3 id="charModalTitle">🧑 人物信息库</h3>
                <button class="close-btn" id="closeCharModalBtn">✕</button>
            </div>
            <div style="padding:8px 4px 0;">
                <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
                    <button id="charAnalyzeBtn" style="padding:6px 14px;background:#7c3aed;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:bold;">✨ 解析当前章节人物</button>
                    <span id="charAnalyzeStatus" style="font-size:12px;color:#888;"></span>
                </div>
                <div style="margin-top:8px;color:#666;font-size:12px;">💡 点「解析当前章节人物」，AI 会自动识别本章出现的人物并更新到下面的表格（主角表 + NPC 表）。</div>
            </div>
            <div id="charModalBody" style="flex:1;overflow-y:auto;padding:12px 4px;"></div>
        </div>
    </div>

    <!-- ====== 配图模态框 ====== -->
    <div class="modal-overlay" id="imageModal">
        <div class="modal-content" style="width:min(500px,90vw);">
            <div class="modal-header">
                <h3>🖼️ 添加配图</h3>
                <button class="close-btn" id="closeImageModalBtn">✕</button>
            </div>
            <div class="modal-body">
                <p style="margin-bottom:12px;color:#8888aa;">为当前章节添加配图（图片URL）</p>
                <input type="text" id="imageUrlInput" placeholder="输入图片URL，如 https://example.com/image.jpg" style="width:100%;padding:10px;border-radius:6px;border:1px solid #2a2a4a;background:#0f0f1a;color:#e0e0e0;font-size:14px;">
                <div style="display:flex;gap:10px;margin-top:12px;">
                    <button id="confirmImageBtn" style="flex:1;padding:8px;border:none;border-radius:6px;background:#ffd866;color:#1a1a2e;font-weight:bold;cursor:pointer;">确认添加</button>
                    <button id="cancelImageBtn" style="flex:1;padding:8px;border:none;border-radius:6px;background:#2a2a4a;color:#c0c0d0;cursor:pointer;">取消</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        //  0. 配置与 API 地址
        // ============================================================

        const API_BASE = window.location.origin;
        console.log('📡 API 地址:', API_BASE);

        function loadApiConfig() {
            try {
                const raw = localStorage.getItem('api_config');
                if (!raw) return null;
                return JSON.parse(raw);
            } catch (e) { return null; }
        }

        function loadComfyuiConfig() {
            try {
                const raw = localStorage.getItem('comfyui_config');
                if (!raw) return null;
                const data = JSON.parse(raw);
                const workflows = data.workflows || [];
                const selected = workflows.find(w => w.isDefault) || workflows[0] || null;
                return {
                    comfyUrl: data.comfyUrl || 'http://127.0.0.1:8188',
                    workflowConfig: selected ? {
                        workflowJson: selected.workflowJson || '',
                        positiveNode: selected.positiveNode || '6',
                        negativeNode: selected.negativeNode || '7',
                        seedNode: selected.seedNode || '',
                        modelName: selected.modelName || '',
                        permanentPositive: selected.permanentPositive || '',
                        promptPosition: selected.promptPosition || 'prefix'
                    } : null
                };
            } catch (e) { return null; }
        }

        function getDefaultEngine() {
            const config = loadApiConfig();
            return config?.defaultEngine || 'comfyui';
        }

        function getEngineLabel(engine) {
            return engine === 'novelai' ? 'NovelAI' : 'ComfyUI';
        }

        // ============================================================
        //  1. 章节数据管理
        // ============================================================
        let chapters = [];
        let currentIndex = -1;

        const sidebarList = document.getElementById('chapterListSidebar');
        const contentArea = document.getElementById('contentArea');
        const mainTitle = document.getElementById('mainTitle');
        const chapterNum = document.getElementById('chapterNum');
        const chapterCount = document.getElementById('chapterCount');
        const importBtn = document.getElementById('importBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const importModal = document.getElementById('importModal');
        const modalBody = document.getElementById('modalBody');
        const modalTitle = document.getElementById('modalTitle');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const expandAllBtn = document.getElementById('expandAllBtn');
        const collapseAllBtn = document.getElementById('collapseAllBtn');
        const addImageBtn = document.getElementById('addImageBtn');
        const imageModal = document.getElementById('imageModal');
        const closeImageModalBtn = document.getElementById('closeImageModalBtn');
        const confirmImageBtn = document.getElementById('confirmImageBtn');
        const cancelImageBtn = document.getElementById('cancelImageBtn');
        const imageUrlInput = document.getElementById('imageUrlInput');

        // ============================================================
        //  2. 渲染函数
        // ============================================================

        function renderSidebar() {
            if (!chapters || chapters.length === 0) {
                sidebarList.innerHTML = `
                    <div class="empty-state" style="padding:40px 20px;font-size:14px;">
                        <div>📭 暂无章节</div>
                        <p style="margin-top:8px;font-size:13px;color:#555;">点击「导入小说」解析 TXT</p>
                    </div>
                `;
                chapterCount.textContent = '0 章';
                return;
            }

            chapterCount.textContent = `${chapters.length} 章`;
            const readSet = getReadSet();
            let html = '';
            for (let i = 0; i < chapters.length; i++) {
                const ch = chapters[i];
                const title = ch.title || `第 ${i + 1} 章`;
                const active = i === currentIndex ? 'active' : '';
                const read = isRead(i);
                const readCls = read ? 'read' : '';
                const dot = read ? '✅' : '⭕';
                html += `
                    <div class="chapter-item-sidebar ${active} ${readCls}" data-index="${i}">
                        <span class="num">${i + 1}</span>
                        <span style="font-size:11px;cursor:pointer;" onclick="event.stopPropagation();toggleRead(${i})" title="点击切换已读/未读">${dot}</span>
                        <span class="title">${escapeHtml(title)}</span>
                        <span class="word-count">${ch.wordCount || ch.content?.length || 0}</span>
                        <span style="font-size:11px;cursor:pointer;padding:0 2px;color:#666;" onclick="event.stopPropagation();moveChapter(${i},-1)" title="上移">↑</span>
                        <span style="font-size:11px;cursor:pointer;padding:0 2px;color:#666;" onclick="event.stopPropagation();moveChapter(${i},1)" title="下移">↓</span>
                        <span class="del-chapter" data-index="${i}" title="删除本章" style="cursor:pointer;color:#666;font-size:14px;padding:0 4px;" onmouseover="this.style.color='#f87171'" onmouseout="this.style.color='#666'">✕</span>
                    </div>
                `;
            }
            sidebarList.innerHTML = html;
            sidebarList.querySelectorAll('.chapter-item-sidebar').forEach(el => {
                el.addEventListener('click', (e) => {
                    if (e.target.classList.contains('del-chapter')) return;
                    const idx = parseInt(el.dataset.index);
                    if (!isNaN(idx) && idx !== currentIndex) {
                        selectChapter(idx);
                        document.body.classList.remove('sidebar-open');
                    }
                });
            });
            sidebarList.querySelectorAll('.del-chapter').forEach(el => {
                el.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    const idx = parseInt(el.dataset.index);
                    const ch = chapters[idx];
                    if (!ch) return;
                    if (!confirm(`确定删除章节「${ch.title || ''}」？此操作不可恢复。`)) return;
                    // 从后端删除
                    if (ch._id) {
                        try { await fetch(`${API_BASE}/api/chapters/${ch._id}`, { method: 'DELETE' }); } catch (err) {}
                    }
                    chapters.splice(idx, 1);
                    // 删的是当前正在看的章节，跳到相邻章节
                    if (idx === currentIndex) {
                        if (currentIndex >= chapters.length) currentIndex = chapters.length - 1;
                        // 如果删的是中间章节，保持原位置看后一章
                    } else if (idx < currentIndex) {
                        currentIndex--;
                    }
                    if (currentIndex < 0) currentIndex = 0;
                    renderSidebar();
                    renderContent();
                    showToast('🗑️ 已删除');
                });
            });
        }

        function renderContent() {
            if (!chapters || chapters.length === 0 || currentIndex < 0 || currentIndex >= chapters.length) {
                contentArea.innerHTML = `
                    <div class="empty-state">
                        <span class="icon">📚</span>
                        <h2>欢迎使用小说阅读器</h2>
                        <p>点击左侧「导入小说」按钮，上传 TXT 文件开始阅读</p>
                    </div>
                `;
                mainTitle.textContent = '📖 小说阅读器';
                chapterNum.textContent = '第 0 章';
                // 重置按钮文字
                document.getElementById('togglePromptsBtn').textContent = '👁️ 显示提示词';
                return;
            }

            const ch = chapters[currentIndex];
            const title = ch.title || `第 ${currentIndex + 1} 章`;
            mainTitle.textContent = title;
            chapterNum.textContent = `第 ${currentIndex + 1} 章 / 共 ${chapters.length} 章`;

            // 图片渲染
            let content = ch.content || '';
            content = content.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, (match, alt, url) => {
                const safeUrl = escapeHtml(url);
                const safeAlt = escapeHtml(alt);
                return `<div style="margin:8px 0;text-align:center;">
<img src="${safeUrl}" alt="${safeAlt}" loading="lazy" style="max-width:100%;border-radius:8px;border:1px solid #2a2a4a;">
<div style="margin-top:4px;">
<a href="${safeUrl}" download="${safeAlt || 'image'}.png" style="font-size:12px;color:#ffd866;text-decoration:none;padding:2px 10px;border:1px solid #ffd866;border-radius:10px;">⬇️ 保存图片</a>
</div></div>`;
            });

            contentArea.innerHTML = `
                <div class="chapter-title">${escapeHtml(title)}</div>
                <div class="chapter-content">${content}</div>
            `;

            // 保持提示词显示状态
            const toggleBtn = document.getElementById('togglePromptsBtn');
            if (contentArea.classList.contains('show-prompts')) {
                toggleBtn.textContent = '👁️ 隐藏提示词';
            } else {
                toggleBtn.textContent = '👁️ 显示提示词';
            }

            renderSidebar();
            prevBtn.style.opacity = currentIndex > 0 ? '1' : '0.4';
            nextBtn.style.opacity = currentIndex < chapters.length - 1 ? '1' : '0.4';
        }

        function getReadSet() {
            const key = 'novel_reader_read_' + (currentNovelId || 'default');
            try { return new Set(JSON.parse(localStorage.getItem(key) || '[]')); }
            catch { return new Set(); }
        }
        function markRead(i) {
            const ch = chapters[i];
            if (!ch) return;
            const id = ch._id || ('idx_' + i);
            const key = 'novel_reader_read_' + (currentNovelId || 'default');
            const s = getReadSet();
            s.add(id);
            localStorage.setItem(key, JSON.stringify([...s]));
        }
        function isRead(i) {
            const ch = chapters[i];
            if (!ch) return false;
            return getReadSet().has(ch._id || ('idx_' + i));
        }
        function toggleRead(i) {
            const ch = chapters[i];
            if (!ch) return;
            const id = ch._id || ('idx_' + i);
            const key = 'novel_reader_read_' + (currentNovelId || 'default');
            const s = getReadSet();
            if (s.has(id)) s.delete(id); else s.add(id);
            localStorage.setItem(key, JSON.stringify([...s]));
            renderSidebar();
            updateReadBtn();
        }
        async function moveChapter(i, dir) {
            const j = i + dir;
            if (j < 0 || j >= chapters.length) return;
            [chapters[i], chapters[j]] = [chapters[j], chapters[i]];
            if (currentIndex === i) currentIndex = j;
            else if (currentIndex === j) currentIndex = i;
            renderSidebar();
            renderContent();
            updateReadBtn();
            // 通知后端重排
            try {
                await fetch(`${API_BASE}/api/chapters/reorder`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ novelId: currentNovelId, order: chapters.map(c => c._id) })
                });
            } catch (e) {}
        }
        function updateReadBtn() {
            const btn = document.getElementById('readToggleBtn');
            if (!btn) return;
            if (isRead(currentIndex)) {
                btn.textContent = '✅ 已读';
                btn.style.color = '#4ade80';
            } else {
                btn.textContent = '⭕ 未读';
                btn.style.color = '#e0e0e0';
            }
        }
        function selectChapter(index) {
            if (index < 0 || index >= chapters.length) return;
            accumulateReadTime();
            currentIndex = index;
            chapterOpenTime = Date.now();
            renderContent();
            contentArea.scrollTop = 0;
            saveProgress();
            updateReadBtn();
        }

        // 阅读时长统计
        let chapterOpenTime = Date.now();
        function accumulateReadTime() {
            if (!chapterOpenTime) return;
            const dt = Math.floor((Date.now() - chapterOpenTime) / 1000);
            if (dt < 5) return; // 少于5秒不算
            const key = 'novel_reader_time_' + (currentNovelId || 'default');
            let data = {};
            try { data = JSON.parse(localStorage.getItem(key) || '{}'); } catch (e) {}
            const today = new Date().toISOString().slice(0, 10);
            data[today] = (data[today] || 0) + dt;
            data.total = (data.total || 0) + dt;
            localStorage.setItem(key, JSON.stringify(data));
            chapterOpenTime = Date.now();
        }
        setInterval(accumulateReadTime, 30000);
        window.addEventListener('beforeunload', accumulateReadTime);

        // 滚动到底部自动标记已读
        contentArea.addEventListener('scroll', () => {
            const el = contentArea;
            if (el.scrollTop + el.clientHeight >= el.scrollHeight - 80) {
                if (!isRead(currentIndex)) {
                    markRead(currentIndex);
                    renderSidebar();
                }
            }
        });

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ============================================================
        //  3. 导入功能
        // ============================================================

        let parserLoaded = false;

        function openImportModal() {
            modalTitle.textContent = '📥 导入小说';
            importModal.classList.add('open');
            modalBody.innerHTML = `
                <iframe src="chapter-parser.html" style="width:100%;height:70vh;border:none;border-radius:6px;background:#0f0f1a;"></iframe>
                <div style="margin-top:12px;text-align:center;color:#666;font-size:13px;">
                    在解析器中选择章节，点击「导入本章」即可添加到阅读器
                </div>
            `;
            if (!parserLoaded) {
                parserLoaded = true;
                window.addEventListener('message', async (event) => {
                    if (!event.data || event.data.type !== 'importChapter') return;
                    const { title, content, wordCount } = event.data.payload;
                    const exists = chapters.some(ch => ch.content === content);
                    if (!exists) {
                        chapters.push({ title, content, wordCount: wordCount || content.length });
                        currentIndex = chapters.length - 1;
                        renderContent();
                        // 保存到后端
                        try {
                            const r = await fetch(`${API_BASE}/api/chapters`, {
                                method: 'POST', headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ title, content, novelId: currentNovelId })
                            });
                            const data = await r.json();
                            if (data.success && data.chapter) chapters[chapters.length - 1]._id = data.chapter.id;
                        } catch (e) { console.warn('保存章节失败:', e); }
                        showToast(`✅ 已导入「${title}」`);
                    } else {
                        showToast('⚠️ 该章节已存在，跳过导入');
                    }
                });
            }
        }

        function closeImportModal() {
            importModal.classList.remove('open');
        }

        // ============================================================
        //  4. 手动配图
        // ============================================================

        function openImageModal() {
            if (!chapters || chapters.length === 0 || currentIndex < 0) {
                showToast('⚠️ 请先选择一章');
                return;
            }
            imageUrlInput.value = '';
            imageModal.classList.add('open');
        }

        function closeImageModal() {
            imageModal.classList.remove('open');
        }

        function addImageToChapter() {
            const url = imageUrlInput.value.trim();
            if (!url) {
                showToast('⚠️ 请输入图片URL');
                return;
            }
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                showToast('⚠️ 请输入有效的图片URL（以 http:// 或 https:// 开头）');
                return;
            }
            const ch = chapters[currentIndex];
            ch.content = ch.content + `\n\n![配图](${url})`;
            ch.wordCount = ch.content.length;
            renderContent();
            saveCurrentChapter();
            closeImageModal();
            showToast('✅ 配图已添加');
        }

        // ============================================================
        //  5. Toast
        // ============================================================

        function showToast(message) {
            const old = document.querySelector('.custom-toast');
            if (old) old.remove();
            const toast = document.createElement('div');
            toast.className = 'custom-toast';
            toast.textContent = message;
            Object.assign(toast.style, {
                position: 'fixed',
                bottom: '30px',
                left: '50%',
                transform: 'translateX(-50%)',
                background: '#1a1a3a',
                color: '#e0e0e0',
                padding: '12px 24px',
                borderRadius: '8px',
                border: '1px solid #2a2a4a',
                zIndex: '9999',
                fontSize: '14px',
                boxShadow: '0 4px 20px rgba(0,0,0,0.5)',
                maxWidth: '90%',
                textAlign: 'center',
                animation: 'fadeInUp 0.3s ease'
            });
            document.body.appendChild(toast);
            const style = document.createElement('style');
            style.textContent = `
                @keyframes fadeInUp {
                    from { opacity: 0; transform: translateX(-50%) translateY(20px); }
                    to { opacity: 1; transform: translateX(-50%) translateY(0); }
                }
            `;
            document.head.appendChild(style);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s';
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        // ============================================================
        //  6. 键盘快捷键（章节切换）
        // ============================================================

        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                if (currentIndex > 0) selectChapter(currentIndex - 1);
            } else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                if (currentIndex < chapters.length - 1) selectChapter(currentIndex + 1);
            } else if (e.key === 'Escape') {
                closeImportModal();
                closeImageModal();
            }
        });

        // ============================================================
        //  7. ⭐ AI 自动配图（场景描述 + 提示词 都隐藏）
        // ============================================================

        const aiImageBtn = document.getElementById('aiImageBtn');
        const aiStopBtn = document.getElementById('aiStopBtn');
        let aiAbortController = null;

        aiStopBtn.addEventListener('click', () => {
            if (aiAbortController) aiAbortController.abort();
            // 兜底：立即恢复 UI
            aiImageBtn.textContent = '✨ AI 自动配图';
            aiImageBtn.disabled = false;
            aiStopBtn.style.display = 'none';
        });

        aiImageBtn.addEventListener('click', async () => {
            if (!chapters || chapters.length === 0 || currentIndex < 0) {
                showToast('⚠️ 请先选择一章');
                return;
            }

            const ch = chapters[currentIndex];
            const title = ch.title || `第 ${currentIndex + 1} 章`;

            if (ch._aiProcessing) {
                showToast('⏳ 正在生成中，请稍候...');
                return;
            }

            if (ch._aiProcessed) {
                if (!confirm('本章已生成过配图，是否重新生成？')) return;
            }

            const config = loadApiConfig();
            if (!config?.llm?.apiKey) {
                showToast('⚠️ 请先在 API 配置中心配置 LLM API Key');
                return;
            }

            const engine = config.defaultEngine || 'comfyui';
            const engineLabel = getEngineLabel(engine);
            const modelName = config.llm?.model || 'gpt-4';

            if (engine === 'novelai' && !config.novelai?.apiKey) {
                showToast('⚠️ 请先在 API 配置中心配置 NovelAI API Key');
                return;
            }

            let workflowConfig = null;
            let comfyUrl = null;
            if (engine === 'comfyui') {
                const comfyui = loadComfyuiConfig();
                if (comfyui && comfyui.workflowConfig) {
                    workflowConfig = comfyui.workflowConfig;
                    comfyUrl = comfyui.comfyUrl;
                }
            }

            const originalText = aiImageBtn.textContent;
            aiImageBtn.textContent = '⏳ 分析中...';
            aiImageBtn.disabled = true;
            aiStopBtn.style.display = 'inline-block';
            ch._aiProcessing = true;
            showToast(`🧠 使用 ${engineLabel} 分析章节...`);
            const originalChapterIndex = currentIndex;

            aiAbortController = new AbortController();
            let timerId = null;
            try {
                const requestBody = {
                    title: title,
                    content: ch.content,
                    engine: engine,
                    model: modelName,
                    width: config.novelai?.width || 832,
                    height: config.novelai?.height || 1216
                };
                if (engine === 'comfyui' && workflowConfig) {
                    requestBody.workflowConfig = workflowConfig;
                }
                if (engine === 'novelai') {
                    try {
                        const n = config.novelai || {};
                        requestBody.apiUrl = n.apiUrl || '';
                        requestBody.apiKey = n.apiKey || '';
                        requestBody.model = n.model || 'nai-diffusion-5-full';
                    } catch (e) {}
                }
                if (engine === 'grok') {
                    try {
                        const grok = JSON.parse(localStorage.getItem('grok_config') || '{}');
                        const [w, h] = (grok.ratio || '1024x1024').split('x').map(Number);
                        requestBody.apiUrl = grok.apiUrl;
                        requestBody.apiKey = grok.apiKey;
                        requestBody.grokModel = grok.model;
                        requestBody.width = w;
                        requestBody.height = h;
                    } catch (e) {}
                }
                if (engine === 'runninghub') {
                    try {
                        const rh = (loadApiConfig() || {}).runninghub || {};
                        requestBody.rhApiKey = rh.apiKey || '';
                        requestBody.rhWorkflowId = rh.workflowId || '';
                        requestBody.rhPosNode = rh.posNode || '6';
                        requestBody.rhPosField = rh.posField || 'text';
                        requestBody.rhNegNode = rh.negNode || '7';
                        requestBody.rhSeedNode = rh.seedNode || '3';
                    } catch (e) {}
                }
                // 固定前置/后置提示词
                try {
                    const fp = JSON.parse(localStorage.getItem('fixed_prompts') || '{}');
                    requestBody.promptPrefix = fp.prefix || '';
                    requestBody.promptSuffix = fp.suffix || '';
                } catch (e) {}

                const progressPanel = document.getElementById('aiProgressPanel');
                const progressTitle = document.getElementById('aiProgressTitle');
                const progressLog = document.getElementById('aiProgressLog');
                // 展开面板，隐藏恢复按钮
                progressPanel.style.display = 'block';
                window._aiProgressCollapsed = false;
                const restoreBtn = document.getElementById('aiProgressRestore');
                if (restoreBtn) restoreBtn.style.display = 'none';
                progressLog.innerHTML = '';
                progressTitle.textContent = '准备中...';
                const logLine = (html) => { progressLog.innerHTML += html + '<br>'; progressLog.scrollTop = progressLog.scrollHeight; };
                const t = (ms) => (ms/1000).toFixed(1) + 's';

                // 实时计时器
                const wallStart = Date.now();
                const timerEl = document.createElement('div');
                timerEl.style.cssText = 'color:#4ade80;font-size:11px;margin-top:6px;';
                progressPanel.appendChild(timerEl);
                timerId = setInterval(() => {
                    timerEl.textContent = '⏱️ ' + t(Date.now() - wallStart);
                }, 100);

                // === 第一步：LLM 分析 ===
                progressTitle.textContent = '🧠 LLM 分析中...';
                logLine('⏳ 正在分析章节、提取场景...');
                const t0 = Date.now();
                const maxScenes = parseInt(document.getElementById('maxScenesInput').value) || 5;
                const llmCfg = (loadApiConfig() || {}).llm || {};
                // 读取配图规则（配图工具页配置的 analyzer_rule）
                let analyzeTemplate = '';
                try {
                    const ar = JSON.parse(localStorage.getItem('analyzer_rule') || '{}');
                    analyzeTemplate = ar.rule || '';
                } catch (e) {}
                // 读取角色设定库 + 人物信息库（当前小说，从后端），合并注入给 AI
                let roles = [];
                try { roles = await fetchRoles(currentNovelId); } catch (e) {}
                try {
                    const cr = await fetch(`${API_BASE}/api/characters?novelId=${encodeURIComponent(currentNovelId)}`);
                    const cd = await cr.json();
                    if (cd.success && Array.isArray(cd.characters)) {
                        // 人物信息库角色：用 外貌/身份/性格 作为设定描述
                        const charRoles = cd.characters
                            .filter(c => c && c.name)
                            .map(c => {
                                const parts = [];
                                if (c.appearance) parts.push('外貌' + c.appearance);
                                if (c.identity) parts.push('身份' + c.identity);
                                if (c.personality) parts.push('性格' + c.personality);
                                return { name: c.name, desc: parts.join('，') };
                            })
                            .filter(r => r.desc);
                        // 合并：人物信息库优先，同名覆盖 role_cards
                        const merged = new Map();
                        for (const r of roles) merged.set(r.name, r);
                        for (const r of charRoles) merged.set(r.name, r);
                        roles = Array.from(merged.values());
                    }
                } catch (e) {}
                const analyzeR = await fetch(`${API_BASE}/api/analyze-only`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, content: ch.content, model: modelName, analyzeTemplate, maxScenes, llmApiUrl: llmCfg.apiUrl || '', llmApiKey: llmCfg.apiKey || '', roles }),
                    signal: aiAbortController.signal
                });
                if (!analyzeR.ok) throw new Error(`分析失败 HTTP ${analyzeR.status}`);
                const analyzeData = await analyzeR.json();
                if (!analyzeData.success) throw new Error(analyzeData.error || '分析失败');
                const scenes = (analyzeData.scenes || []).slice(0, maxScenes);
                const tAnalyze = Date.now() - t0;
                logLine(`✅ 分析完成，找到 ${scenes.length} 个场景（耗时 ${t(tAnalyze)}）`);

                // === 应用替换规则 ===
                try {
                    const fp = JSON.parse(localStorage.getItem('fixed_prompts') || '{}');
                    const rulesText = fp.replaceRules || '';
                    if (rulesText && scenes.length) {
                        const ruleCount = rulesText.split('\n').filter(l=>l.trim()).length;
                        logLine(`🔄 应用替换规则（${ruleCount} 条）`);
                        for (const sc of scenes) {
                            let out = sc.prompt || '';
                            const pres = [], posts = [];
                            for (const line of rulesText.split('\n')) {
                                const s = line.trim();
                                if (!s || !s.includes('=')) continue;
                                const [trigger, rest] = s.split('=', 2);
                                if (!rest || !out.includes(trigger)) continue;
                                const parts = rest.split('|');
                                const action = (parts[0]||'').trim();
                                const val = (parts[1]||'').trim();
                                if (action === '替换') { logLine(`  替换 "${trigger}" → "${val}"`); out = out.split(trigger).join(val); }
                                else if (action === '前置') pres.push(val);
                                else if (action === '后置') posts.push(val);
                            }
                            if (pres.length) out = pres.join(', ') + ', ' + out;
                            if (posts.length) out = out + ', ' + posts.join(', ');
                            sc.prompt = out;
                        }
                    }
                } catch (e) { console.error('替换规则错误:', e); }

                if (!scenes.length) {
                    showToast('ℹ️ 未找到适合配图的场景');
                    progressTitle.textContent = 'ℹ️ 未找到场景';
                    return;
                }

                // === 第二步：并发生图 ===
                let insertedCount = 0, failedCount = 0;
                // RunningHub 免费版并发上限低，降到 1；其他引擎保持 3
                const CONCURRENCY = (engine === 'runninghub') ? 1 : 3;
                const results = new Array(scenes.length);

                async function genOne(i) {
                    const scene = scenes[i];
                    const sceneLabel = scene.scene || `场景 ${i+1}`;
                    const promptText = scene.prompt || '（无提示词）';
                    logLine(`⏳ 场景 ${i+1}/${scenes.length}: ${sceneLabel.slice(0,20)}...`);
                    const ts0 = Date.now();
                    // RunningHub 免费版「队列满」自动重试（最多3次，间隔5s）
                    const maxRetries = (engine === 'runninghub') ? 3 : 0;
                    let lastErr = null;
                    for (let attempt = 0; attempt <= maxRetries; attempt++) {
                        try {
                            if (attempt > 0) {
                                logLine(`  ↻ 重试场景${i+1}（第${attempt}次，等待5s避让队列）...`);
                                await new Promise(r => setTimeout(r, 5000));
                            }
                            const genR = await fetch(`${API_BASE}/api/generate-scene`, {
                                method: 'POST', headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    prompt: scene.prompt, negative_prompt: scene.negative_prompt || '',
                                    engine, workflowConfig, comfyUrl, scene: sceneLabel, anchor: scene.anchor || '',
                                    ...requestBody, novelId: currentNovelId
                                }),
                                signal: aiAbortController.signal
                            });
                            const genData = await genR.json();
                            if (!genR.ok || !genData.success) throw new Error(genData.error || '生成失败');
                            const imageUrl = genData.image?.url || genData.image;
                            const ts = Date.now() - ts0;
                            logLine(`  ✅ 场景${i+1}成功（${t(ts)}）`);
                            results[i] = { ok: true, imageUrl, sceneLabel, promptText, anchor: scene.anchor || '' };
                            insertedCount++;
                            lastErr = null;
                            break;
                        } catch (sceneErr) {
                            if (sceneErr.name === 'AbortError') throw sceneErr;
                            lastErr = sceneErr;
                            const isQueueFull = /TASK_QUEUE_MAXED|队列满|queue.*max/i.test(sceneErr.message || '');
                            // 队列满可重试；其他错误不重试
                            if (attempt >= maxRetries || !isQueueFull) break;
                        }
                    }
                    if (lastErr) {
                        const ts = Date.now() - ts0;
                        logLine(`  ❌ 场景${i+1}失败（${t(ts)}）: ${(lastErr.message||'').slice(0,80)}`);
                        results[i] = { ok: false, error: lastErr.message || '生成失败', sceneLabel, promptText, anchor: scene.anchor || '' };
                        failedCount++;
                    }
                }

                // 分批并发
                for (let batch = 0; batch < scenes.length; batch += CONCURRENCY) {
                    const batchIdx = [];
                    for (let j = batch; j < Math.min(batch + CONCURRENCY, scenes.length); j++) batchIdx.push(j);
                    progressTitle.textContent = `🎨 生图 ${batch + 1}-${batchIdx.length + batch}/${scenes.length}`;
                    await Promise.all(batchIdx.map(i => genOne(i)));
                }

                // === 第三步：统一插入结果到章节 ===
                for (let i = 0; i < results.length; i++) {
                    const r = results[i];
                    if (!r) continue;
                    let insertPos = ch.content.length;
                    if (r.anchor && r.anchor.trim()) {
                        const anchor = r.anchor.trim();
                        const pos = ch.content.indexOf(anchor);
                        if (pos !== -1) {
                            let e = ch.content.indexOf('\n\n', pos+anchor.length);
                            if (e===-1) e=ch.content.indexOf('\n',pos+anchor.length);
                            if(e===-1) e=ch.content.length;
                            insertPos = e;
                        }
                    }
                    if (r.ok) {
                        const infoHtml = `<div class="prompt-text"><div>📝 场景：${escapeHtml(r.sceneLabel)}</div><div>📌 提示词：${escapeHtml(r.promptText)}</div></div>`;
                        ch.content = ch.content.slice(0, insertPos) + `\n\n---\n![${escapeHtml(r.sceneLabel)}](${r.imageUrl})\n${infoHtml}\n---\n` + ch.content.slice(insertPos);
                    } else {
                        const failId = 'fail-' + Date.now() + '-' + i;
                        const errHtml = `<div style="font-size:12px;color:#f87171;background:#2a1414;padding:6px 8px;border-radius:4px;margin-bottom:8px;">❌ ${escapeHtml(r.error)}</div>`;
                        ch.content = ch.content.slice(0, insertPos) + `\n\n---\n<div class="gen-fail" id="${failId}" data-prompt="${escapeHtml(r.promptText)}" data-label="${escapeHtml(r.sceneLabel)}" style="margin:12px 0;padding:12px 14px;background:#1a1414;border:1px dashed #f87171;border-radius:8px;">\n<div style="color:#f87171;font-weight:600;margin-bottom:6px;">⚠️ 场景：${escapeHtml(r.sceneLabel)}（图片生成失败）</div>\n${errHtml}<div style="font-size:12px;color:#999;margin-bottom:10px;line-height:1.6;">📌 ${escapeHtml(r.promptText)}</div>\n<button onclick="retryGenImage(this)" style="padding:6px 16px;background:#f87171;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:13px;">🔄 重新生成这张图</button>\n</div>\n---\n` + ch.content.slice(insertPos);
                    }
                }
                await saveCurrentChapter();

        // ============================================================
        async function retryGenImage(btn) {
            const box = btn.closest('.gen-fail');
            if (!box) return;
            const prompt = box.dataset.prompt;
            const label = box.dataset.label || '插图';
            if (!prompt) { showToast('⚠️ 缺少提示词'); return; }
            btn.disabled = true;
            const oldText = btn.textContent;
            btn.textContent = '⏳ 生成中...';
            try {
                const config = loadApiConfig() || {};
                const engine = config.defaultEngine || 'comfyui';
                let workflowConfig = null, comfyUrl = null;
                if (engine === 'comfyui') {
                    const c = loadComfyuiConfig();
                    if (c && c.workflowConfig) { workflowConfig = c.workflowConfig; comfyUrl = c.comfyUrl; }
                }
                let endpoint, body;
                if (engine === 'novelai') {
                    endpoint = '/api/novelai-generate';
                    body = { prompt };
                } else if (engine === 'grok') {
                    endpoint = '/api/grok-generate';
                    let grok = {};
                    try { grok = JSON.parse(localStorage.getItem('grok_config') || '{}'); } catch (e) {}
                    const [w, h] = (grok.ratio || '1024x1024').split('x').map(Number);
                    let fp = {};
                    try { fp = JSON.parse(localStorage.getItem('fixed_prompts') || '{}'); } catch (e) {}
                    body = { prompt, apiUrl: grok.apiUrl, apiKey: grok.apiKey, grokModel: grok.model, width: w, height: h, promptPrefix: fp.prefix || '', promptSuffix: fp.suffix || '' };
                } else {
                    endpoint = '/api/generate';
                    body = { prompt, workflowConfig, comfyUrl };
                }
                const r = await fetch(`${API_BASE}${endpoint}`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await r.json();
                if (!r.ok || !data.success) throw new Error(data.error || '生成失败');
                const url = (engine === 'novelai' || engine === 'grok') ? (data.images && data.images[0]) || data.image?.url : data.image?.url;
                if (!url) throw new Error('未返回图片');

                // 替换 DOM 占位块为图片 + 提示词说明
                const wrap = document.createElement('div');
                wrap.innerHTML = `<img src="${url}" alt="${escapeHtml(label)}" loading="lazy" style="max-width:100%;border-radius:8px;border:1px solid #2a2a4a;margin:8px 0;">
<div class="prompt-text"><div>📝 场景：${escapeHtml(label)}</div><div>📌 提示词：${escapeHtml(prompt)}</div></div>`;
                box.replaceWith(wrap);

                // 同步回 ch.content，避免切章后回退成失败块
                if (typeof chapters !== 'undefined' && currentIndex >= 0) {
                    const ch = chapters[currentIndex];
                    const id = box.id;
                    const anchor = `id="${id}"`;
                    const pos = ch.content.indexOf(anchor);
                    if (pos !== -1) {
                        const start = ch.content.lastIndexOf('<div class="gen-fail"', pos);
                        // 找到 gen-fail 块的结尾：按钮后的 </div>
                        const btnPos = ch.content.indexOf('</button>', pos);
                        const end = btnPos !== -1 ? ch.content.indexOf('</div>', btnPos) + '</div>'.length : ch.content.indexOf('</div>', pos) + '</div>'.length;
                        let realStart = start;
                        let realEnd = end;
                        const before = ch.content.slice(0, start);
                        const after = ch.content.slice(end);
                        const m1 = before.match(/\n*---\n*$/);
                        if (m1) realStart = start - m1[0].length;
                        const m2 = after.match(/^\n*---\n*/);
                        if (m2) realEnd = end + m2[0].length;
                        ch.content = ch.content.slice(0, realStart) + `\n\n---\n![${label}](${url})\n<div class="prompt-text"><div>📝 场景：${escapeHtml(label)}</div><div>📌 提示词：${escapeHtml(prompt)}</div></div>\n---\n` + ch.content.slice(realEnd);
                        ch.wordCount = ch.content.length;
                    }
                }
                saveCurrentChapter();
                showToast('✅ 已重新生成');
            } catch (e) {
                console.error('重试失败:', e);
                showToast('❌ ' + e.message);
                // 在失败块里显示具体错误
                let errEl = box.querySelector('.retry-err');
                if (!errEl) {
                    errEl = document.createElement('div');
                    errEl.className = 'retry-err';
                    errEl.style.cssText = 'font-size:12px;color:#f87171;background:#2a1414;padding:6px 8px;border-radius:4px;margin-bottom:8px;';
                    box.insertBefore(errEl, box.querySelector('button'));
                }
                errEl.textContent = '❌ ' + e.message;
                btn.disabled = false;
                btn.textContent = oldText;
            }
        }

                /^[卷部][零一二三四五六七八九十百千万0-9]+/,
                /^Chapter\s*\d+/i,
                /^【?第[零一二三四五六七八九十百千万0-9]+[章节回部集]】?/,
                /^前言\s*$/,
                /^楔子\s*$/,
                /^序章\s*$/,
                /^引子\s*$/,
                /^终章\s*$/,
                /^尾声\s*$/,
                /^后记\s*$/,
                /^番外\s*$/
            ];

            function isChapterTitle(line) {
                const trimmed = line.trim();
                if (!trimmed || trimmed.length > 50) return false;
                for (const pattern of patterns) {
                    if (pattern.test(trimmed)) return true;
                }
                return false;
            }

            for (const line of lines) {
                if (isChapterTitle(line)) {
                    if (currentContent.trim()) {
                        chapters.push({ title: currentTitle, content: currentContent.trim(), wordCount: currentContent.trim().length });
                    }
                    currentTitle = line.trim();
                    currentContent = '';
                } else {
                    currentContent += line + '\n';
                }
            }
            if (currentContent.trim()) {
                chapters.push({ title: currentTitle, content: currentContent.trim(), wordCount: currentContent.trim().length });
            }
            if (chapters.length === 0 && text.trim()) {
                chapters.push({ title: '全文', content: text.trim(), wordCount: text.trim().length });
            }
            return chapters;
        }

        // ============================================================
        //  12. 初始化：从后端加载小说列表 + 章节
        // ============================================================
        let novels = [];
        let currentNovelId = localStorage.getItem('novel_reader_current') || null;

        async function loadNovels() {
            try {
                const r = await fetch(`${API_BASE}/api/novels`);
                const data = await r.json();
                if (data.success && Array.isArray(data.novels)) {
                    novels = data.novels;
                    const sel = document.getElementById('novelSelect');
                    sel.innerHTML = novels.map(n => `<option value="${n.id}">${escapeHtml(n.name)}</option>`).join('');
                    if (!currentNovelId || !novels.find(n => n.id === currentNovelId)) {
                        currentNovelId = novels[0]?.id || null;
                    }
                    if (currentNovelId) sel.value = currentNovelId;
                    localStorage.setItem('novel_reader_current', currentNovelId || '');
                }
            } catch (e) { console.warn('加载小说列表失败:', e); }
        }

        async function loadChaptersFromServer() {
            try {
                const url = currentNovelId ? `${API_BASE}/api/chapters?novelId=${currentNovelId}` : `${API_BASE}/api/chapters`;
                const r = await fetch(url);
                const data = await r.json();
                if (data.success && Array.isArray(data.chapters) && data.chapters.length) {
                    chapters = data.chapters.map(c => ({
                        title: c.title, content: c.content,
                        wordCount: c.content?.length || 0, _id: c.id
                    }));
                    return true;
                }
                chapters = [];
            } catch (e) { console.warn('加载章节失败:', e); }
            return false;
        }

        async function switchNovel(nid) {
            currentNovelId = nid;
            localStorage.setItem('novel_reader_current', nid || '');
            currentIndex = 0;
            await loadChaptersFromServer();
            renderSidebar();
            renderContent();
        }

        // 小说选择器事件
        document.getElementById('novelSelect').addEventListener('change', (e) => switchNovel(e.target.value));
        document.getElementById('newNovelBtn').addEventListener('click', async () => {
            const name = prompt('输入小说名称：');
            if (!name) return;
            const r = await fetch(`${API_BASE}/api/novels`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name })
            });
            const data = await r.json();
            if (data.success) {
                await loadNovels();
                document.getElementById('novelSelect').value = data.novel.id;
                await switchNovel(data.novel.id);
            }
        });
        document.getElementById('renameNovelBtn').addEventListener('click', async () => {
            const cur = novels.find(n => n.id === currentNovelId);
            if (!cur) return;
            const name = prompt('重命名小说：', cur.name);
            if (!name) return;
            await fetch(`${API_BASE}/api/novels/${currentNovelId}`, {
                method: 'PUT', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name })
            });
            await loadNovels();
        });
        // ===== 角色设定库（按小说，后端存储）=====
        // 读取当前小说角色（roles 数组）
        async function fetchRoles(novelId) {
            try {
                const r = await fetch(`${API_BASE}/api/roles?novelId=${encodeURIComponent(novelId || currentNovelId)}`);
                const d = await r.json();
                return d.success ? (d.roles || []) : [];
            } catch (e) { return []; }
        }
        // 角色数组 → 文本（角色名：描述，每行一条）
        function rolesToText(roles) {
            return (roles || []).map(r => `${r.name}：${r.desc}`).join('\n');
        }
        // 文本 → 角色数组
        function textToRoles(text) {
            const out = [];
            for (const line of (text || '').split('\n')) {
                const s = line.trim();
                if (!s) continue;
                const idx = s.indexOf('：');
                const idx2 = s.indexOf(':');
                const sep = (idx !== -1 && (idx2 === -1 || idx < idx2)) ? idx : idx2;
                if (sep === -1) continue;
                const name = s.slice(0, sep).trim();
                const desc = s.slice(sep + 1).trim();
                if (name && desc) out.push({ name, desc });
            }
            return out;
        }
        // 角色设定库（当前小说）
        document.getElementById('roleCardsBtn').addEventListener('click', async () => {
            const cur = novels.find(n => n.id === currentNovelId);
            if (!cur) { showToast('⚠️ 请先选择一本小说', 'warn'); return; }
            const rolesArr = await fetchRoles(currentNovelId);
            const current = rolesToText(rolesArr);
            const input = prompt(
                `为《${cur.name}》设置角色设定卡（每行一个，格式：角色名：外貌、服装、气质）\n\n当前已保存：\n${current || '（无）'}\n\n直接修改后确定保存：`,
                current
            );
            if (input === null) return;
            const newRoles = textToRoles(input);
            try {
                const r = await fetch(`${API_BASE}/api/roles`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ novelId: currentNovelId, roles: newRoles })
                });
                const d = await r.json();
                if (!d.success) throw new Error(d.error || '保存失败');
                showToast(`✅ 已保存《${cur.name}》角色设定 ${newRoles.length} 条`, 'success');
            } catch (e) {
                showToast('❌ 保存失败: ' + e.message, 'error');
            }
        });
        // ===== 导出当前小说（配图完整迁移）=====
        document.getElementById('exportNovelBtn').addEventListener('click', async () => {
            const cur = novels.find(n => n.id === currentNovelId);
            if (!cur) { showToast('⚠️ 请先选择一本小说', 'warn'); return; }
            try {
                showToast('⏳ 正在打包导出...', 'info');
                const r = await fetch(`${API_BASE}/api/novels/${currentNovelId}/export`);
                const data = await r.json();
                if (!data.success && !data.novel) throw new Error(data.error || '导出失败');
                // 下载 JSON 文件
                const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `《${cur.name}》配图导出.json`;
                a.click();
                URL.revokeObjectURL(a.href);
                showToast(`✅ 已导出《${cur.name}》（含 ${data.chapters?.length || 0} 章、${Object.keys(data.images || {}).length} 张图）`, 'success');
            } catch (e) {
                showToast('❌ 导出失败: ' + e.message, 'error');
            }
        });
        // ===== 导入小说（从导出文件恢复）=====
        document.getElementById('importNovelBtn').addEventListener('click', () => document.getElementById('importNovelFile').click());
        document.getElementById('importNovelFile').addEventListener('change', async (e) => {
            const f = e.target.files[0];
            if (!f) return;
            try {
                const text = await f.text();
                const payload = JSON.parse(text);
                if (payload.type !== 'novel-reader-export') throw new Error('不是有效的导出文件');
                showToast('⏳ 正在导入（含图片恢复）...', 'info');
                const r = await fetch(`${API_BASE}/api/novels/import`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const d = await r.json();
                if (!d.success) throw new Error(d.error || '导入失败');
                await loadNovels();
                await switchNovel(d.novel.id);
                showToast(`✅ 已导入《${d.novel.name}》（${d.importedChapters} 章、${d.importedImages} 张图）`, 'success');
            } catch (err) {
                showToast('❌ 导入失败: ' + err.message, 'error');
            }
            e.target.value = '';
        });
        document.getElementById('delNovelBtn').addEventListener('click', async () => {
            if (!currentNovelId) return;
            if (!confirm('删除这本小说及其所有章节和插图？此操作不可恢复！')) return;
            await fetch(`${API_BASE}/api/novels/${currentNovelId}`, { method: 'DELETE' });
            await loadNovels();
            if (novels[0]) await switchNovel(novels[0].id);
        });

        // ===== 人物信息库（AI 解析章节，增量更新主角/NPC 表）=====
        const charModal = document.getElementById('charModal');
        const charModalBody = document.getElementById('charModalBody');
        let charList = [];
        document.getElementById('charactersBtn').addEventListener('click', async () => {
            const cur = novels.find(n => n.id === currentNovelId);
            if (!cur) { showToast('⚠️ 请先选择一本小说', 'warn'); return; }
            document.getElementById('charModalTitle').textContent = `🧑 人物信息库（《${cur.name}》）`;
            charModal.classList.add('open');
            await loadCharacters();
        });
        document.getElementById('closeCharModalBtn').addEventListener('click', () => charModal.classList.remove('open'));
        charModal.addEventListener('click', (e) => { if (e.target === charModal) charModal.classList.remove('open'); });

        async function loadCharacters() {
            try {
                const r = await fetch(`${API_BASE}/api/characters?novelId=${encodeURIComponent(currentNovelId)}`);
                const d = await r.json();
                charList = d.success ? (d.characters || []) : [];
                renderCharacters();
            } catch (e) { charModalBody.innerHTML = `<div style="color:#f87171;padding:20px;">加载失败: ${e.message}</div>`; }
        }
        function renderCharacters() {
            const protagonists = charList.filter(c => c.role === '主角');
            const npcs = charList.filter(c => c.role !== '主角');
            const statEl = document.getElementById('charAnalyzeStatus');
            if (statEl) statEl.textContent = `共 ${charList.length} 人（主角 ${protagonists.length}，NPC ${npcs.length}）`;
            const card = (c) => `
                <div style="background:#0e0e1e;border:1px solid #2a2a4a;border-radius:8px;padding:10px 12px;margin-bottom:8px;">
                    <div style="display:flex;align-items:center;gap:8px;">
                        <b style="color:#e9d5ff;">${escapeHtml(c.name)}</b>
                        <span style="font-size:11px;padding:1px 8px;border-radius:10px;background:${c.role==='主角'?'#7c3aed':'#2a2a4a'};color:${c.role==='主角'?'#fff':'#aaa'};">${escapeHtml(c.role||'NPC')}</span>
                        <span style="font-size:11px;color:#666;margin-left:auto;">出现 ${c.appearances||1} 次</span>
                        <button onclick="editChar('${c.id}')" style="font-size:11px;padding:2px 8px;background:#2a2a4a;color:#ffd866;border:1px solid #ffd866;border-radius:5px;cursor:pointer;">✏️ 编辑</button>
                        <button onclick="delChar('${c.id}')" style="font-size:11px;padding:2px 8px;background:#2a2a4a;color:#f87171;border:1px solid #f87171;border-radius:5px;cursor:pointer;">🗑️ 删除</button>
                    </div>
                    ${c.identity?`<div style="font-size:12px;color:#7dd3fc;margin-top:4px;">🏷️ ${escapeHtml(c.identity)}</div>`:''}
                    ${c.appearance?`<div style="font-size:12px;color:#c0c0d0;margin-top:3px;">👤 外貌：${escapeHtml(c.appearance)}</div>`:''}
                    ${c.personality?`<div style="font-size:12px;color:#c0c0d0;margin-top:3px;">💭 性格：${escapeHtml(c.personality)}</div>`:''}
                    ${c.relation?`<div style="font-size:12px;color:#c0c0d0;margin-top:3px;">🔗 关系：${escapeHtml(c.relation)}</div>`:''}
                    ${c.firstChapter?`<div style="font-size:11px;color:#666;margin-top:3px;">📖 首见：${escapeHtml(c.firstChapter)}</div>`:''}
                </div>`;
            charModalBody.innerHTML = `
                <div style="margin-bottom:10px;"><button onclick="addCharManual()" style="padding:6px 14px;background:#38bdf8;color:#06283d;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:bold;">➕ 手动添加人物</button></div>
                ${charList.length === 0 ? '<div style="color:#666;text-align:center;padding:30px;">暂无人物，点击上方「解析当前章节人物」或「手动添加人物」</div>' : ''}
                ${protagonists.length ? `<h4 style="color:#7c3aed;margin:6px 0;">⭐ 主角信息表（${protagonists.length}）</h4>${protagonists.map(card).join('')}` : ''}
                ${npcs.length ? `<h4 style="color:#38bdf8;margin:10px 0 6px;">👥 NPC 信息表（${npcs.length}）</h4>${npcs.map(card).join('')}` : ''}
            `;
        }
        async function saveCharList() {
            try {
                await fetch(`${API_BASE}/api/characters/save`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ novelId: currentNovelId, characters: charList })
                });
            } catch (e) { showToast('❌ 保存失败: ' + e.message, 'error'); }
        }
        async function editChar(id) {
            const c = charList.find(x => x.id === id);
            if (!c) return;
            const name = prompt('人物姓名：', c.name); if (name === null) return;
            const role = prompt('类型（主角/NPC）：', c.role || 'NPC'); if (role === null) return;
            const identity = prompt('身份/职业：', c.identity || ''); if (identity === null) return;
            const appearance = prompt('外貌描写：', c.appearance || ''); if (appearance === null) return;
            const personality = prompt('性格特征：', c.personality || ''); if (personality === null) return;
            const relation = prompt('与主角/故事的关系：', c.relation || ''); if (relation === null) return;
            c.name = name.trim(); c.role = role.trim() === '主角' ? '主角' : 'NPC';
            c.identity = identity.trim(); c.appearance = appearance.trim();
            c.personality = personality.trim(); c.relation = relation.trim();
            await saveCharList();
            renderCharacters();
            showToast('✅ 已保存修改', 'success');
        }
        async function delChar(id) {
            if (!confirm('确定删除该人物？')) return;
            charList = charList.filter(x => x.id !== id);
            await saveCharList();
            renderCharacters();
            showToast('🗑️ 已删除', 'success');
        }
        async function addCharManual() {
            const name = prompt('新人物姓名：'); if (!name || !name.trim()) return;
            const role = prompt('类型（主角/NPC）：', 'NPC');
            const identity = prompt('身份/职业：', '') || '';
            const appearance = prompt('外貌描写：', '') || '';
            const personality = prompt('性格特征：', '') || '';
            const relation = prompt('与主角/故事的关系：', '') || '';
            charList.push({
                id: uid2(),
                name: name.trim(), role: (role||'NPC').trim() === '主角' ? '主角' : 'NPC',
                identity, appearance, personality, relation,
                firstChapter: '', lastChapter: '', appearances: 1
            });
            await saveCharList();
            renderCharacters();
            showToast('✅ 已添加人物', 'success');
        }
        function uid2(){ return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
        // 暴露到全局，供 onclick 使用
        window.editChar = editChar; window.delChar = delChar; window.addCharManual = addCharManual;
        function escapeHtml(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

        // 解析当前章节人物
        document.getElementById('charAnalyzeBtn').addEventListener('click', async () => {
            if (currentIndex < 0 || !chapters[currentIndex]) { showToast('⚠️ 请先打开一章', 'warn'); return; }
            const ch = chapters[currentIndex];
            const llmCfg = (loadApiConfig() || {}).llm || {};
            if (!llmCfg.apiKey) { showToast('⚠️ 请先配置 LLM API Key', 'warn'); return; }
            const statusEl = document.getElementById('charAnalyzeStatus');
            const btn = document.getElementById('charAnalyzeBtn');
            btn.disabled = true; btn.textContent = '⏳ 解析中...';
            statusEl.textContent = 'AI 正在识别本章人物...';
            try {
                const r = await fetch(`${API_BASE}/api/characters/analyze`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        novelId: currentNovelId, content: ch.content, title: ch.title,
                        model: llmCfg.model, llmApiUrl: llmCfg.apiUrl, llmApiKey: llmCfg.apiKey
                    })
                });
                const d = await r.json();
                if (!d.success) throw new Error(d.error || '解析失败');
                statusEl.textContent = `✅ 新增 ${d.added.length} 人，更新 ${d.updated.length} 人`;
                await loadCharacters();
                if (d.added.length) showToast(`✨ 新增人物：${d.added.join(', ')}`, 'success');
            } catch (e) {
                statusEl.textContent = '❌ ' + e.message;
                showToast('❌ 解析失败: ' + e.message, 'error');
            } finally {
                btn.disabled = false; btn.textContent = '✨ 解析当前章节人物';
            }
        });

        // 保存当前章节到后端（AI 配图改了内容后调用）
        async function saveCurrentChapter() {
            if (currentIndex < 0 || !chapters[currentIndex]) return;
            const ch = chapters[currentIndex];
            try {
                const r = await fetch(`${API_BASE}/api/chapters`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: ch._id, title: ch.title, content: ch.content, novelId: currentNovelId })
                });
                const data = await r.json();
                if (data.success && data.chapter) {
                    ch._id = data.chapter.id;
                } else {
                    showToast('⚠️ 保存失败: ' + (data.error || '未知错误'));
                }
            } catch (e) { console.warn('保存章节失败:', e); showToast('⚠️ 网络错误，章节未保存'); }
        }

        applyReaderSettings();
        applyBg();
        if (readerSettings.customFontName) {
            document.getElementById('fontFamilyBtn').textContent = '🔤 ' + readerSettings.customFontName.slice(0, 10);
        }
        (async () => {
            await loadNovels();
            const loaded = await loadChaptersFromServer();
            if (!loaded) {
                chapters = [];
            }
            renderSidebar();
            renderContent();
            updateReadBtn();
            // 恢复阅读进度
            try {
                const prog = JSON.parse(localStorage.getItem('novel_reader_progress') || 'null');
                if (prog && prog.index >= 0 && prog.index < chapters.length) {
                    currentIndex = prog.index;
                    renderContent();
                    requestAnimationFrame(() => { contentArea.scrollTop = prog.scroll || 0; });
                } else {
                    currentIndex = 0;
                    renderContent();
                }
            } catch (e) {
                currentIndex = 0;
                renderContent();
            }
        })();

        console.log('📖 小说阅读器已启动');
        console.log('📡 API 地址:', API_BASE);
    </script>
</body>
</html>
