<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧪 ComfyUI 工作流测试</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: #0f0f1a;
            color: #e0e0e0;
            padding: 16px;
            min-height: 100vh;
        }
        .test-container {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* 头部 */
        .test-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #2a2a4a;
            flex-wrap: wrap;
            gap: 10px;
        }
        .test-header h2 {
            color: #ffd866;
            font-size: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .test-header .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            padding: 4px 12px;
            border-radius: 20px;
            background: #14142a;
            border: 1px solid #2a2a4a;
        }
        .test-header .status-badge .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }
        .dot.online { background: #4ade80; }
        .dot.offline { background: #f87171; }
        .dot.checking { background: #fbbf24; animation: pulse 1s infinite; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* 主布局 */
        .test-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        @media (max-width: 800px) {
            .test-layout {
                grid-template-columns: 1fr;
            }
        }

        /* 卡片 */
        .card {
            background: #14142a;
            border: 1px solid #2a2a4a;
            border-radius: 10px;
            padding: 16px 18px;
        }
        .card-title {
            font-size: 13px;
            font-weight: 600;
            color: #8888aa;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 表单 */
        .form-group {
            margin-bottom: 10px;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            color: #8888aa;
            margin-bottom: 3px;
        }
        .form-group textarea,
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 7px 10px;
            border-radius: 6px;
            border: 1px solid #2a2a4a;
            background: #0f0f1a;
            color: #e0e0e0;
            font-size: 13px;
            font-family: inherit;
            transition: border-color 0.2s;
        }
        .form-group textarea:focus,
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #ffd866;
        }
        .form-group textarea {
            resize: vertical;
            min-height: 80px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.5;
        }
        .form-group .hint {
            font-size: 11px;
            color: #555;
            margin-top: 3px;
        }
        .form-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .form-row .form-group {
            flex: 1;
            min-width: 120px;
        }

        /* 按钮 */
        .btn {
            padding: 7px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
        }
        .btn-primary {
            background: #ffd866;
            color: #1a1a2e;
        }
        .btn-primary:hover {
            background: #ffe080;
            transform: translateY(-1px);
        }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .btn-secondary {
            background: #2a2a4a;
            color: #c0c0d0;
        }
        .btn-secondary:hover {
            background: #3a3a5a;
        }
        .btn-success {
            background: #4ade80;
            color: #1a1a2e;
        }
        .btn-success:hover {
            background: #5be890;
        }
        .btn-danger {
            background: #f87171;
            color: #1a1a2e;
        }
        .btn-danger:hover {
            background: #fc8181;
        }
        .btn-sm {
            padding: 4px 10px;
            font-size: 12px;
        }
        .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        /* 图片预览 */
        .image-preview {
            margin-top: 12px;
            border-radius: 8px;
            overflow: hidden;
            background: #0a0a14;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px dashed #2a2a4a;
            position: relative;
        }
        .image-preview img {
            max-width: 100%;
            max-height: 500px;
            object-fit: contain;
            display: block;
        }
        .image-preview .placeholder {
            color: #555;
            font-size: 14px;
            padding: 40px 20px;
            text-align: center;
        }
        .image-preview .loading-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 8px;
        }
        .image-preview .loading-overlay .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #2a2a4a;
            border-top-color: #ffd866;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 日志 */
        .log-area {
            background: #0a0a14;
            border-radius: 6px;
            padding: 10px 12px;
            max-height: 150px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.6;
            margin-top: 8px;
        }
        .log-area .log-line {
            padding: 2px 0;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }
        .log-area .log-line .time {
            color: #555;
            margin-right: 8px;
        }
        .log-area .log-line .level-info { color: #60a5fa; }
        .log-area .log-line .level-success { color: #4ade80; }
        .log-area .log-line .level-error { color: #f87171; }
        .log-area .log-line .level-warn { color: #fbbf24; }

        /* 工作流选择器 */
        .workflow-selector {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }
        .workflow-selector select {
            flex: 1;
            min-width: 150px;
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid #2a2a4a;
            background: #0f0f1a;
            color: #e0e0e0;
            font-size: 13px;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a1a3a;
            padding: 10px 24px;
            border-radius: 8px;
            border: 1px solid #2a2a4a;
            font-size: 14px;
            z-index: 999;
            animation: fadeInUp 0.3s ease;
            max-width: 90%;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        .toast.success { border-color: #4ade80; }
        .toast.error { border-color: #f87171; }
    </style>
</head>
<body>
    <div class="test-container">
        <!-- 头部 -->
        <div class="test-header">
            <h2>🧪 工作流测试</h2>
            <div class="status-badge">
                <span class="dot" id="statusDot"></span>
                <span id="statusText">检测中...</span>
                <button class="btn btn-sm btn-secondary" id="checkStatusBtn">重新检测</button>
            </div>
        </div>

        <div class="test-layout">
            <!-- 左栏：配置 -->
            <div class="card">
                <div class="card-title">⚙️ 测试配置</div>

                <!-- 工作流选择 -->
                <div class="workflow-selector">
                    <select id="workflowSelect">
                        <option value="">-- 请选择工作流 --</option>
                    </select>
                    <button class="btn btn-sm btn-secondary" id="refreshWorkflowsBtn">🔄 刷新</button>
                    <button class="btn btn-sm btn-secondary" id="loadFromConfigBtn">📥 从配置加载</button>
                </div>

                <!-- ComfyUI URL -->
                <div class="form-group">
                    <label>ComfyUI URL</label>
                    <input type="text" id="comfyUrl" value="http://127.0.0.1:8188">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>正面提示词节点 ID</label>
                        <input type="text" id="positiveNode" value="6">
                    </div>
                    <div class="form-group">
                        <label>负面提示词节点 ID</label>
                        <input type="text" id="negativeNode" value="7">
                    </div>
                     <div class="form-group">
                        <label>正面节点字段名</label>
                        <input type="text" id="posFieldName" value="text" placeholder="text / positive / prompt">
                        <div class="hint">节点中存放提示词的字段名</div>
                    </div>
                    <div class="form-group">
                        <label>负面节点字段名</label>
                        <input type="text" id="negFieldName" value="text" placeholder="text / negative">
                        <div class="hint">节点中存放提示词的字段名</div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Seed 节点 ID</label>
                        <input type="text" id="seedNode" placeholder="留空则随机">
                    </div>
                    <div class="form-group">
                        <label>轮询间隔 (ms)</label>
                        <input type="number" id="pollInterval" value="1200">
                    </div>
                </div>

                <!-- 提示词 -->
                <div class="form-group">
                    <label>正面提示词</label>
                    <textarea id="positivePrompt" rows="3" placeholder="输入正面提示词...">masterpiece, best quality, high resolution, detailed, fantasy art</textarea>
                </div>
                <div class="form-group">
                    <label>负面提示词</label>
                    <textarea id="negativePrompt" rows="2" placeholder="输入负面提示词...">worst quality, low quality, blurry, deformed</textarea>
                </div>

                <!-- 工作流 JSON -->
                <div class="form-group">
                    <label>工作流 JSON</label>
                    <textarea id="workflowJson" rows="6" placeholder="粘贴工作流 JSON 数据..."></textarea>
                    <div class="hint">💡 可以从 ComfyUI 导出工作流，或从配置中加载</div>
                </div>

                <!-- 操作按钮 -->
                <div class="btn-group">
                    <button class="btn btn-primary" id="runTestBtn">▶ 运行测试</button>
                    <button class="btn btn-secondary" id="clearLogBtn">清除日志</button>
                    <button class="btn btn-secondary" id="clearImageBtn">清除图片</button>
                    <button class="btn btn-sm btn-secondary" id="showWorkflowBtn">🔍 查看工作流</button>
                    <button class="btn btn-sm btn-secondary" id="previewPromptBtn">👁️ 预览提示词</button>
                </div>
            </div>

            <!-- 右栏：结果 -->
            <div class="card">
                <div class="card-title">🖼️ 生成结果</div>

                <!-- 图片预览 -->
                <div class="image-preview" id="imagePreview">
                    <div class="placeholder">
                        <div style="font-size:32px;margin-bottom:8px;">🖼️</div>
                        <div>运行测试后，生成的图片将显示在这里</div>
                        <div style="font-size:12px;color:#444;margin-top:4px;">支持 PNG / JPEG / WebP</div>
                    </div>
                </div>

                <!-- 任务信息 -->
                <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:#8888aa;">
                    <span>任务 ID: <span id="taskId" style="color:#e0e0e0;">-</span></span>
                    <span>状态: <span id="taskStatus" style="color:#e0e0e0;">就绪</span></span>
                    <span>耗时: <span id="taskTime" style="color:#e0e0e0;">-</span></span>
                </div>

                <!-- 日志 -->
                <div class="card-title" style="margin-top:12px;">📋 运行日志</div>
                <div class="log-area" id="logArea">
                    <div class="log-line"><span class="time">[系统]</span><span class="level-info">等待运行测试...</span></div>
                </div>
            </div>
        </div>

        <!-- 提示词预览弹窗 -->
        <div class="preview-modal" id="previewModal">
            <div class="preview-modal-content">
                <div class="modal-title">
                    <span>👁️ 提示词预览（发送到 ComfyUI）</span>
                    <button class="modal-close" id="closePreviewModal">✕</button>
                </div>
                <div id="previewContent">
                    <div style="text-align:center;color:#666;padding:20px;">点击「预览提示词」查看</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        //  1. 数据与状态
        // ============================================================
        let currentWorkflow = null;
        let isRunning = false;

        // DOM 引用
        const comfyUrl = document.getElementById('comfyUrl');
        const workflowSelect = document.getElementById('workflowSelect');
        const positiveNode = document.getElementById('positiveNode');
        const negativeNode = document.getElementById('negativeNode');
        const seedNode = document.getElementById('seedNode');
        const pollInterval = document.getElementById('pollInterval');
        const positivePrompt = document.getElementById('positivePrompt');
        const negativePrompt = document.getElementById('negativePrompt');
        const workflowJson = document.getElementById('workflowJson');
        const imagePreview = document.getElementById('imagePreview');
        const taskId = document.getElementById('taskId');
        const taskStatus = document.getElementById('taskStatus');
        const taskTime = document.getElementById('taskTime');
        const logArea = document.getElementById('logArea');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');

        // ============================================================
        //  2. 日志系统
        // ============================================================
        function addLog(message, level = 'info') {
            const time = new Date().toLocaleTimeString();
            const line = document.createElement('div');
            line.className = 'log-line';
            line.innerHTML = `<span class="time">[${time}]</span><span class="level-${level}">${message}</span>`;
            logArea.appendChild(line);
            logArea.scrollTop = logArea.scrollHeight;
        }

        function clearLog() {
            logArea.innerHTML = '';
            addLog('日志已清除', 'info');
        }

        // ============================================================
        //  3. Toast 提示
        // ============================================================
        function showToast(msg, type = 'info') {
            const old = document.querySelector('.toast');
            if (old) old.remove();
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // ============================================================
        //  4. ComfyUI 状态检测
        // ============================================================
        async function checkComfyStatus() {
            const url = comfyUrl.value.trim();
            statusDot.className = 'dot checking';
            statusText.textContent = '检测中...';

            try {
                const res = await fetch(`${url}/system_stats`, {
                    signal: AbortSignal.timeout(5000)
                });
                if (res.ok) {
                    statusDot.className = 'dot online';
                    statusText.textContent = '🟢 已连接';
                    addLog('✅ ComfyUI 连接成功', 'success');
                    return true;
                } else {
                    throw new Error(`HTTP ${res.status}`);
                }
            } catch (error) {
                statusDot.className = 'dot offline';
                statusText.textContent = '🔴 未连接';
                addLog(`❌ ComfyUI 连接失败: ${error.message}`, 'error');
                return false;
            }
        }

        // ============================================================
        //  5. 工作流管理
        // ============================================================
        function loadWorkflowsFromStorage() {
            try {
                const raw = localStorage.getItem('comfyui_config');
                if (!raw) return [];
                const data = JSON.parse(raw);
                return data.workflows || [];
            } catch (e) {
                return [];
            }
        }

        function populateWorkflowSelect() {
            const workflows = loadWorkflowsFromStorage();
            workflowSelect.innerHTML = '<option value="">-- 请选择工作流 --</option>';
            for (const wf of workflows) {
                const opt = document.createElement('option');
                opt.value = JSON.stringify(wf);
                opt.textContent = wf.name || '未命名工作流';
                if (wf.isDefault) opt.textContent += ' ⭐';
                workflowSelect.appendChild(opt);
            }
            if (workflows.length === 0) {
                addLog('💡 没有找到已保存的工作流，请先在 ComfyUI 配置中创建', 'warn');
            }
        }

        function loadWorkflowFromSelect() {
            const val = workflowSelect.value;
            if (!val) {
                showToast('请选择一个工作流', 'warn');
                return;
            }
            try {
                const wf = JSON.parse(val);
                currentWorkflow = wf;
                positiveNode.value = wf.positiveNode || '6';
                negativeNode.value = wf.negativeNode || '7';
                seedNode.value = wf.seedNode || '';
                pollInterval.value = wf.pollInterval || 1200;
                workflowJson.value = wf.workflowJson || '';
                if (wf.permanentPositive) {
                    positivePrompt.value = wf.permanentPositive;
                }
                if (wf.defaultNegative) {
                    negativePrompt.value = wf.defaultNegative;
                }
                addLog(`📋 已加载工作流: ${wf.name || '未命名'}`, 'success');
                showToast(`✅ 已加载: ${wf.name || '未命名'}`, 'success');
            } catch (e) {
                showToast('❌ 工作流数据无效', 'error');
                addLog(`❌ 工作流加载失败: ${e.message}`, 'error');
            }
        }

        // ============================================================
//  6. 核心测试功能（修复版）
// ============================================================
async function runTest() {
    if (isRunning) {
        showToast('⏳ 正在运行中，请等待', 'warn');
        return;
    }

    const url = comfyUrl.value.trim();
    if (!url) {
        showToast('⚠️ 请输入 ComfyUI URL', 'error');
        return;
    }

    // 检查连接
    const isOnline = await checkComfyStatus();
    if (!isOnline) return;

    // 准备数据
    const positive = positivePrompt.value.trim() || 'masterpiece, best quality';
    const negative = negativePrompt.value.trim() || 'worst quality, blurry';
    let workflowData = workflowJson.value.trim();

    if (!workflowData) {
        showToast('⚠️ 请导入或粘贴工作流 JSON', 'error');
        addLog('❌ 缺少工作流 JSON', 'error');
        return;
    }

    // 解析工作流
    let workflow;
    try {
        workflow = JSON.parse(workflowData);
    } catch (e) {
        showToast('❌ 工作流 JSON 格式错误', 'error');
        addLog(`❌ JSON 解析失败: ${e.message}`, 'error');
        return;
    }

    // ============================================================
    //  关键修复：获取节点配置并注入提示词和随机 Seed
    // ============================================================
    
    const posNodeId = positiveNode.value.trim() || '6';
    const negNodeId = negativeNode.value.trim() || '7';
    const seedNodeId = seedNode.value.trim();
    
    // 生成随机 Seed
    const randomSeed = Math.floor(Math.random() * 1000000000);
    
    addLog(`🎲 生成随机 Seed: ${randomSeed}`, 'info');
    addLog(`📝 正面提示词: ${positive.slice(0, 50)}...`, 'info');
    addLog(`📝 负面提示词: ${negative.slice(0, 50)}...`, 'info');

    // 获取字段名配置
    const posField = document.getElementById('posFieldName').value.trim() || 'text';
    const negField = document.getElementById('negFieldName').value.trim() || 'text';

    // ---- 注入正面提示词 ----
    if (workflow[posNodeId]) {
        if (workflow[posNodeId].inputs) {
            workflow[posNodeId].inputs[posField] = positive;
            addLog(`✅ 正面提示词已注入到节点 ${posNodeId} 的字段 "${posField}"`, 'success');
        }
    }

    // ---- 注入负面提示词 ----
    if (negNodeId && workflow[negNodeId]) {
        if (workflow[negNodeId].inputs) {
            workflow[negNodeId].inputs[negField] = negative;
            addLog(`✅ 负面提示词已注入到节点 ${negNodeId} 的字段 "${negField}"`, 'success');
        }
    }
    // ---- 3. 注入随机 Seed（关键修复） ----
    let seedInjected = false;
    
    // 策略1: 如果指定了 Seed 节点 ID，直接注入
    if (seedNodeId && workflow[seedNodeId]) {
        if (workflow[seedNodeId].inputs) {
            if (workflow[seedNodeId].inputs.seed !== undefined) {
                workflow[seedNodeId].inputs.seed = randomSeed;
                seedInjected = true;
            } else if (workflow[seedNodeId].inputs.noise_seed !== undefined) {
                workflow[seedNodeId].inputs.noise_seed = randomSeed;
                seedInjected = true;
            } else {
                addLog(`⚠️ 节点 ${seedNodeId} 没有 seed 或 noise_seed 字段`, 'warn');
            }
        }
    }
    
    // 策略2: 如果没指定，自动查找所有包含 seed 的节点
    if (!seedInjected) {
        for (const nodeId in workflow) {
            const node = workflow[nodeId];
            if (node.inputs) {
                // 检查是否有 seed 字段
                if (node.inputs.seed !== undefined) {
                    node.inputs.seed = randomSeed;
                    seedInjected = true;
                    addLog(`✅ 自动注入 Seed 到节点 ${nodeId}`, 'success');
                    break;
                }
                // 检查是否有 noise_seed 字段
                if (node.inputs.noise_seed !== undefined) {
                    node.inputs.noise_seed = randomSeed;
                    seedInjected = true;
                    addLog(`✅ 自动注入 noise_seed 到节点 ${nodeId}`, 'success');
                    break;
                }
            }
        }
    }
    
    if (!seedInjected) {
        addLog(`⚠️ 未找到可注入 Seed 的节点，使用工作流默认值`, 'warn');
    }

    // ---- 4. 打印最终工作流的关键信息（调试用） ----
    addLog(`📋 工作流节点数: ${Object.keys(workflow).length}`, 'info');

    // ---- 5. 开始运行 ----
    isRunning = true;
    document.getElementById('runTestBtn').disabled = true;
    document.getElementById('runTestBtn').textContent = '⏳ 运行中...';
    taskStatus.textContent = '运行中...';
    taskId.textContent = '-';
    taskTime.textContent = '-';

    // 清空旧图片
    imagePreview.innerHTML = `
        <div class="loading-overlay">
            <div class="spinner"></div>
            <div style="color:#ffd866;">⏳ 生成中...</div>
            <div style="color:#888;font-size:12px;">Seed: ${randomSeed}</div>
        </div>
    `;

    const startTime = Date.now();
    let imageData = null;
    let promptId = null;

    try {
        addLog('📤 提交任务到 ComfyUI...', 'info');

        // 提交任务
        const submitRes = await fetch(`${url}/prompt`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ prompt: workflow })
        });

        if (!submitRes.ok) {
            let errorMsg = `HTTP ${submitRes.status}`;
            try {
                const errorData = await submitRes.json();
                errorMsg = errorData.error?.message || JSON.stringify(errorData);
            } catch (e) {}
            throw new Error(errorMsg);
        }

        const submitData = await submitRes.json();
        promptId = submitData.prompt_id;
        taskId.textContent = promptId;
        addLog(`✅ 任务已提交: ${promptId} (Seed: ${randomSeed})`, 'success');

        // 轮询结果
        const interval = parseInt(pollInterval.value) || 1200;
        let attempts = 0;
        const maxAttempts = 120;

        while (attempts < maxAttempts) {
            await new Promise(r => setTimeout(r, interval));
            attempts++;
            taskStatus.textContent = `生成中... ${Math.round(attempts * interval / 1000)}s`;

            try {
                const historyRes = await fetch(`${url}/history/${promptId}`);
                if (historyRes.ok) {
                    const history = await historyRes.json();
                    if (history[promptId] && history[promptId].outputs) {
                        const outputs = history[promptId].outputs;
                        for (const nodeId in outputs) {
                            const nodeOut = outputs[nodeId];
                            if (nodeOut.images && nodeOut.images.length > 0) {
                                imageData = nodeOut.images[0];
                                break;
                            }
                        }
                        if (imageData) {
                            addLog(`✅ 图片生成完成！节点: ${Object.keys(outputs).join(', ')}`, 'success');
                            break;
                        }
                    }
                }
            } catch (e) {
                // 继续等待
            }

            if (attempts % 10 === 0) {
                addLog(`⏳ 等待中... ${Math.round(attempts * interval / 1000)}s`, 'info');
            }
        }

        if (!imageData) {
            throw new Error('生成超时，请检查 ComfyUI 是否正常运行');
        }

        // 显示图片
        const imageUrl = `${url}/view?filename=${encodeURIComponent(imageData.filename)}&type=${imageData.type || 'output'}&subfolder=${encodeURIComponent(imageData.subfolder || '')}`;
        imagePreview.innerHTML = `
            <img src="${imageUrl}" alt="生成图片" onerror="this.parentElement.innerHTML='<div class=\\'placeholder\\'><div style=\\'font-size:32px;\\'>❌</div><div>图片加载失败</div></div>'">
            <div style="position:absolute;bottom:10px;right:10px;background:rgba(0,0,0,0.7);padding:4px 12px;border-radius:4px;font-size:11px;color:#888;">
                Seed: ${randomSeed}
            </div>
        `;
        imagePreview.style.position = 'relative';
        
        const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
        taskTime.textContent = `${elapsed}s`;
        taskStatus.textContent = '✅ 完成';
        addLog(`✅ 测试完成！耗时 ${elapsed}s，Seed: ${randomSeed}`, 'success');
        showToast('✅ 测试完成！', 'success');

    } catch (error) {
        taskStatus.textContent = '❌ 失败';
        addLog(`❌ 测试失败: ${error.message}`, 'error');
        showToast(`❌ 测试失败: ${error.message}`, 'error');
        imagePreview.innerHTML = `
            <div class="placeholder">
                <div style="font-size:32px;color:#f87171;">❌</div>
                <div style="color:#f87171;">生成失败</div>
                <div style="font-size:12px;color:#555;margin-top:4px;">${error.message}</div>
            </div>
        `;
    } finally {
        isRunning = false;
        document.getElementById('runTestBtn').disabled = false;
        document.getElementById('runTestBtn').textContent = '▶ 运行测试';
        if (taskStatus.textContent === '运行中...') {
            taskStatus.textContent = '⏹ 已停止';
        }
    }
}

        // ============================================================
        //  7. 事件绑定
        // ============================================================

        // 检测状态
        document.getElementById('checkStatusBtn').addEventListener('click', checkComfyStatus);

        // 刷新工作流列表
        document.getElementById('refreshWorkflowsBtn').addEventListener('click', () => {
            populateWorkflowSelect();
            addLog('🔄 已刷新工作流列表', 'info');
        });

        // 从配置加载工作流
        document.getElementById('loadFromConfigBtn').addEventListener('click', loadWorkflowFromSelect);

        // 工作流选择变化
        workflowSelect.addEventListener('change', () => {
            if (workflowSelect.value) {
                loadWorkflowFromSelect();
            }
        });

        // 运行测试
        document.getElementById('runTestBtn').addEventListener('click', runTest);

        // 清除日志
        document.getElementById('clearLogBtn').addEventListener('click', clearLog);

        // 清除图片
        document.getElementById('clearImageBtn').addEventListener('click', () => {
            imagePreview.innerHTML = `
                <div class="placeholder">
                    <div style="font-size:32px;margin-bottom:8px;">🖼️</div>
                    <div>已清除</div>
                </div>
            `;
            taskId.textContent = '-';
            taskStatus.textContent = '就绪';
            taskTime.textContent = '-';
            addLog('🗑️ 图片已清除', 'info');
        });

        // Ctrl+Enter 快捷运行
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                e.preventDefault();
                runTest();
            }
        });

        // ============================================================
        //  8. 初始化
        // ============================================================

        // 从 URL 参数加载配置
        function loadFromUrlParams() {
            const params = new URLSearchParams(window.location.search);
            const wfJson = params.get('workflow');
            const pos = params.get('positive');
            const neg = params.get('negative');
            const url = params.get('url');
            
            if (wfJson) {
                try {
                    workflowJson.value = decodeURIComponent(wfJson);
                    addLog('📥 从 URL 加载了工作流', 'info');
                } catch (e) {}
            }
            if (pos) positivePrompt.value = decodeURIComponent(pos);
            if (neg) negativePrompt.value = decodeURIComponent(neg);
            if (url) comfyUrl.value = decodeURIComponent(url);
        }

        // 初始化
        async function init() {
            addLog('🧪 工作流测试工具已加载', 'info');
            addLog('💡 提示: Ctrl+Enter 快捷运行测试', 'info');
            
            populateWorkflowSelect();
            loadFromUrlParams();
            
            // 检测 ComfyUI 状态
            await checkComfyStatus();

            // 如果有默认工作流，自动加载
            if (workflowSelect.options.length > 1) {
                const defaultOpt = Array.from(workflowSelect.options).find(opt => opt.text.includes('⭐'));
                if (defaultOpt) {
                    workflowSelect.value = defaultOpt.value;
                    loadWorkflowFromSelect();
                }
            }
        }

        init();

        console.log('🧪 工作流测试工具已加载');
        console.log('💡 使用方式:');
        console.log('  1. 从 ComfyUI 导出工作流 JSON');
        console.log('  2. 粘贴到工作流 JSON 区域');
        console.log('  3. 点击「运行测试」生成图片');
        console.log('  4. 查看右侧结果和日志');

    document.getElementById('showWorkflowBtn').addEventListener('click', () => {
    const workflowData = workflowJson.value.trim();
    if (!workflowData) {
        showToast('⚠️ 没有工作流数据', 'warn');
        return;
    }
    try {
        const wf = JSON.parse(workflowData);
        // 显示关键信息
        let info = '📋 工作流节点:\n';
        for (const nodeId in wf) {
            const node = wf[nodeId];
            const title = node.meta?.title || node.class_type || 'unknown';
            const hasPos = node.inputs?.text ? ' (有提示词)' : '';
            const hasSeed = node.inputs?.seed !== undefined ? ' (有Seed)' : '';
            info += `  ${nodeId}: ${title}${hasPos}${hasSeed}\n`;
        }
        addLog(info, 'info');
        alert(info);
    } catch (e) {
        showToast('❌ JSON 解析失败', 'error');
    }
});

// ============================================================
//  提示词预览功能
// ============================================================

function showPromptPreview() {
    const positive = positivePrompt.value.trim() || 'masterpiece, best quality';
    const negative = negativePrompt.value.trim() || 'worst quality, blurry';
    const posNodeId = positiveNode.value.trim() || '6';
    const negNodeId = negativeNode.value.trim() || '7';
    const seedNodeId = seedNode.value.trim();
    const randomSeed = Math.floor(Math.random() * 1000000000);
    
    // 解析工作流，检查节点是否存在
    let workflowData = workflowJson.value.trim();
    let workflow = null;
    let posNodeExists = false;
    let negNodeExists = false;
    let seedNodeExists = false;
    let currentPosText = '';
    let currentNegText = '';
    
    if (workflowData) {
        try {
            workflow = JSON.parse(workflowData);
            
            // 检查节点是否存在
            if (workflow[posNodeId]) {
                posNodeExists = true;
                currentPosText = workflow[posNodeId].inputs?.text || '(空)';
            }
            if (workflow[negNodeId]) {
                negNodeExists = true;
                currentNegText = workflow[negNodeId].inputs?.text || '(空)';
            }
            if (seedNodeId && workflow[seedNodeId]) {
                seedNodeExists = true;
            }
        } catch (e) {
            // JSON 解析失败
        }
    }
    
    // 构建预览内容
    let html = '';
    
    // 正面提示词
    html += `
        <div class="preview-section">
            <div class="label">✅ 正面提示词 <span class="badge-success">(将注入到节点 ${posNodeId})</span></div>
            <div class="content highlight">${escapeHtml(positive)}</div>
            ${posNodeExists ? `<div class="node-info">📌 节点 ${posNodeId} 当前内容: ${escapeHtml(currentPosText.slice(0, 80))}${currentPosText.length > 80 ? '...' : ''}</div>` : `<div class="node-info badge-error">⚠️ 节点 ${posNodeId} 不存在于工作流中</div>`}
        </div>
    `;
    
    // 负面提示词
    html += `
        <div class="preview-section">
            <div class="label">❌ 负面提示词 <span class="badge-warn">(将注入到节点 ${negNodeId})</span></div>
            <div class="content">${escapeHtml(negative)}</div>
            ${negNodeExists ? `<div class="node-info">📌 节点 ${negNodeId} 当前内容: ${escapeHtml(currentNegText.slice(0, 80))}${currentNegText.length > 80 ? '...' : ''}</div>` : `<div class="node-info badge-error">⚠️ 节点 ${negNodeId} 不存在于工作流中</div>`}
        </div>
    `;
    
    // Seed
    html += `
        <div class="preview-section">
            <div class="label">🎲 Seed <span class="badge-success">(将随机生成)</span></div>
            <div class="content">${randomSeed}</div>
            ${seedNodeId ? (seedNodeExists ? `<div class="node-info">📌 将注入到节点 ${seedNodeId}</div>` : `<div class="node-info badge-error">⚠️ 节点 ${seedNodeId} 不存在于工作流中</div>`) : `<div class="node-info badge-warn">⚠️ 未指定 Seed 节点，将自动查找</div>`}
        </div>
    `;
    
    // 工作流状态
    const nodeCount = workflow ? Object.keys(workflow).length : 0;
    html += `
        <div class="preview-section" style="border-top:1px solid #2a2a4a;padding-top:12px;">
            <div class="label">📋 工作流状态</div>
            <div class="node-info">节点总数: ${nodeCount}</div>
            ${nodeCount < 3 ? `<div class="node-info badge-error">⚠️ 工作流节点太少，请加载完整工作流</div>` : `<div class="node-info badge-success">✅ 工作流看起来完整</div>`}
            ${!posNodeExists ? `<div class="node-info badge-error">❌ 正面提示词节点 ${posNodeId} 不存在</div>` : ''}
            ${!negNodeExists ? `<div class="node-info badge-error">❌ 负面提示词节点 ${negNodeId} 不存在</div>` : ''}
        </div>
    `;
    
    document.getElementById('previewContent').innerHTML = html;
    document.getElementById('previewModal').classList.add('open');
}

// 关闭预览弹窗
document.getElementById('closePreviewModal').addEventListener('click', () => {
    document.getElementById('previewModal').classList.remove('open');
});

// 点击外部关闭
document.getElementById('previewModal').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) {
        document.getElementById('previewModal').classList.remove('open');
    }
});

// 预览按钮
document.getElementById('previewPromptBtn').addEventListener('click', showPromptPreview);

// 辅助：转义 HTML
function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// 查看工作流详情
document.getElementById('showWorkflowBtn').addEventListener('click', () => {
    const workflowData = workflowJson.value.trim();
    if (!workflowData) {
        showToast('⚠️ 没有工作流数据', 'warn');
        return;
    }
    try {
        const wf = JSON.parse(workflowData);
        let info = '📋 工作流节点详情:\n\n';
        let hasValidNode = false;
        for (const nodeId in wf) {
            const node = wf[nodeId];
            const title = node.meta?.title || node.class_type || 'unknown';
            const inputs = node.inputs || {};
            const text = inputs.text || '(空)';
            const seed = inputs.seed !== undefined ? inputs.seed : '(无)';
            const hasClip = inputs.clip !== undefined ? '有CLIP连接' : '无CLIP';
            info += `节点 ${nodeId}: ${title}\n`;
            info += `  class_type: ${node.class_type || '未知'}\n`;
            info += `  text: "${text.slice(0, 60)}${text.length > 60 ? '...' : ''}"\n`;
            info += `  seed: ${seed}\n`;
            info += `  ${hasClip}\n\n`;
            if (text && text !== '(空)') hasValidNode = true;
        }
        info += `\n${hasValidNode ? '✅ 有节点包含提示词内容' : '❌ 所有节点的 text 都为空！'}`;
        alert(info);
        addLog('📋 已显示工作流详情', 'info');
    } catch (e) {
        showToast('❌ JSON 解析失败: ' + e.message, 'error');
        addLog(`❌ 解析失败: ${e.message}`, 'error');
    }
});
    </script>
</body>
