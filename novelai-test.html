<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎨 NovelAI 连接测试</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: #0f0f1a;
            color: #e0e0e0;
            padding: 16px;
            min-height: 100vh;
        }
        .test-container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* 头部 */
        .test-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #2a2a4a;
            flex-wrap: wrap;
            gap: 10px;
        }
        .test-header h2 {
            color: #ff6b9d;
            font-size: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .test-header .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            padding: 4px 12px;
            border-radius: 20px;
            background: #14142a;
            border: 1px solid #2a2a4a;
        }
        .status-badge .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }
        .dot.online { background: #4ade80; }
        .dot.offline { background: #f87171; }
        .dot.checking { background: #fbbf24; animation: pulse 1s infinite; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* 卡片 */
        .card {
            background: #14142a;
            border: 1px solid #2a2a4a;
            border-radius: 10px;
            padding: 16px 18px;
            margin-bottom: 14px;
        }
        .card-title {
            font-size: 13px;
            font-weight: 600;
            color: #8888aa;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 表单 */
        .form-group {
            margin-bottom: 10px;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            color: #8888aa;
            margin-bottom: 3px;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 7px 10px;
            border-radius: 6px;
            border: 1px solid #2a2a4a;
            background: #0f0f1a;
            color: #e0e0e0;
            font-size: 13px;
            font-family: inherit;
            transition: border-color 0.2s;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #ff6b9d;
        }
        .form-group textarea {
            resize: vertical;
            min-height: 60px;
            font-family: inherit;
            font-size: 13px;
            line-height: 1.5;
        }
        .form-group .hint {
            font-size: 11px;
            color: #555;
            margin-top: 3px;
        }
        .form-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .form-row .form-group {
            flex: 1;
            min-width: 100px;
        }

        /* 按钮 */
        .btn {
            padding: 7px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
        }
        .btn-primary {
            background: #ff6b9d;
            color: #1a1a2e;
        }
        .btn-primary:hover {
            background: #ff7fab;
            transform: translateY(-1px);
        }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .btn-secondary {
            background: #2a2a4a;
            color: #c0c0d0;
        }
        .btn-secondary:hover {
            background: #3a3a5a;
        }
        .btn-success {
            background: #4ade80;
            color: #1a1a2e;
        }
        .btn-success:hover {
            background: #5be890;
        }
        .btn-sm {
            padding: 4px 10px;
            font-size: 12px;
        }
        .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        /* 图片预览 */
        .image-preview {
            margin-top: 10px;
            border-radius: 8px;
            overflow: hidden;
            background: #0a0a14;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px dashed #2a2a4a;
            position: relative;
        }
        .image-preview img {
            max-width: 100%;
            max-height: 500px;
            object-fit: contain;
            display: block;
        }
        .image-preview .placeholder {
            color: #555;
            font-size: 14px;
            padding: 40px 20px;
            text-align: center;
        }
        .image-preview .loading-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 8px;
        }
        .image-preview .loading-overlay .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #2a2a4a;
            border-top-color: #ff6b9d;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 日志 */
        .log-area {
            background: #0a0a14;
            border-radius: 6px;
            padding: 10px 12px;
            max-height: 120px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.6;
            margin-top: 8px;
        }
        .log-area .log-line {
            padding: 2px 0;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }
        .log-area .log-line .time {
            color: #555;
            margin-right: 8px;
        }
        .log-area .log-line .level-info { color: #60a5fa; }
        .log-area .log-line .level-success { color: #4ade80; }
        .log-area .log-line .level-error { color: #f87171; }
        .log-area .log-line .level-warn { color: #fbbf24; }

        /* NovelAI 特有样式 */
        .novelai-badge {
            background: #ff6b9d20;
            border: 1px solid #ff6b9d40;
            border-radius: 4px;
            padding: 2px 10px;
            font-size: 11px;
            color: #ff6b9d;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a1a3a;
            padding: 10px 24px;
            border-radius: 8px;
            border: 1px solid #2a2a4a;
            font-size: 14px;
            z-index: 999;
            animation: fadeInUp 0.3s ease;
            max-width: 90%;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        .toast.success { border-color: #4ade80; }
        .toast.error { border-color: #f87171; }
    </style>
</head>
<body>
    <div class="test-container">
        <!-- 头部 -->
        <div class="test-header">
            <h2>🎨 NovelAI 连接测试 <span class="novelai-badge">v1.0</span></h2>
            <div class="status-badge">
                <span class="dot" id="statusDot"></span>
                <span id="statusText">检测中...</span>
                <button class="btn btn-sm btn-secondary" id="checkStatusBtn">重新检测</button>
            </div>
        </div>

        <!-- ====== 配置区域 ====== -->
        <div class="card">
            <div class="card-title">🔑 API 配置</div>
            <div class="form-group">
                <label>NovelAI API Key</label>
                <input type="password" id="apiKey" placeholder="请输入你的 NovelAI API Key...">
                <div class="hint">在 NovelAI 官网 → Account → API Key 获取</div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>API 地址</label>
                    <input type="text" id="apiUrl" value="https://api.novelai.net/ai/generate-image">
                    <div class="hint">通常不需要修改</div>
                </div>
                <div class="form-group" style="flex:0.4;">
                    <label>超时（秒）</label>
                    <input type="number" id="timeout" value="60" min="10">
                </div>
            </div>
        </div>

        <!-- ====== 生图参数 ====== -->
        <div class="card">
            <div class="card-title">🎨 生图参数</div>

            <div class="form-group">
                <label>正面提示词</label>
                <textarea id="positivePrompt" rows="2" placeholder="输入正面提示词...">1girl, masterpiece, best quality, high resolution, detailed, fantasy art, beautiful</textarea>
            </div>
            <div class="form-group">
                <label>负面提示词</label>
                <textarea id="negativePrompt" rows="2" placeholder="输入负面提示词...">worst quality, low quality, blurry, ugly, deformed, bad anatomy</textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>采样器</label>
                    <select id="sampler">
                        <option value="k_euler">Euler</option>
                        <option value="k_euler_ancestral">Euler Ancestral</option>
                        <option value="k_dpmpp_2m">DPM++ 2M</option>
                        <option value="k_dpmpp_2s_ancestral">DPM++ 2S Ancestral</option>
                        <option value="k_dpmpp_sde">DPM++ SDE</option>
                        <option value="k_dpm_fast">DPM Fast</option>
                        <option value="k_dpm_adaptive">DPM Adaptive</option>
                        <option value="ddim">DDIM</option>
                        <option value="plms">PLMS</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>步数</label>
                    <input type="number" id="steps" value="28" min="1" max="50">
                </div>
                <div class="form-group">
                    <label>CFG 强度</label>
                    <input type="number" id="cfg" value="7" min="1" max="20" step="0.5">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>图片宽度</label>
                    <select id="width">
                        <option value="512">512</option>
                        <option value="640">640</option>
                        <option value="768" selected>768</option>
                        <option value="832">832</option>
                        <option value="1024">1024</option>
                        <option value="1216">1216</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>图片高度</label>
                    <select id="height">
                        <option value="512">512</option>
                        <option value="640">640</option>
                        <option value="768" selected>768</option>
                        <option value="832">832</option>
                        <option value="1024">1024</option>
                        <option value="1216">1216</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>生成数量</label>
                    <input type="number" id="n" value="1" min="1" max="4">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group" style="flex:0.5;">
                    <label>随机 Seed</label>
                    <input type="number" id="seed" placeholder="留空则随机">
                    <div class="hint">留空则每次随机</div>
                </div>
            </div>
        </div>

        <!-- ====== 操作按钮 ====== -->
        <div class="card">
            <div class="btn-group">
                <button class="btn btn-primary" id="runTestBtn">▶ 运行测试</button>
                <button class="btn btn-secondary" id="clearLogBtn">清除日志</button>
                <button class="btn btn-secondary" id="clearImageBtn">清除图片</button>
                <button class="btn btn-secondary" id="saveConfigBtn">💾 保存配置</button>
            </div>
        </div>

        <!-- ====== 结果区域 ====== -->
        <div class="card">
            <div class="card-title">🖼️ 生成结果</div>

            <div class="image-preview" id="imagePreview">
                <div class="placeholder">
                    <div style="font-size:32px;margin-bottom:8px;">🖼️</div>
                    <div>运行测试后，生成的图片将显示在这里</div>
                    <div style="font-size:12px;color:#444;margin-top:4px;">支持 PNG / JPEG / WebP</div>
                </div>
            </div>

            <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:#8888aa;">
                <span>任务 ID: <span id="taskId" style="color:#e0e0e0;">-</span></span>
                <span>状态: <span id="taskStatus" style="color:#e0e0e0;">就绪</span></span>
                <span>耗时: <span id="taskTime" style="color:#e0e0e0;">-</span></span>
            </div>

            <div class="card-title" style="margin-top:12px;">📋 运行日志</div>
            <div class="log-area" id="logArea">
                <div class="log-line"><span class="time">[系统]</span><span class="level-info">等待运行测试...</span></div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        //  1. 数据管理
        // ============================================================
        let isRunning = false;

        // DOM 引用
        const apiKey = document.getElementById('apiKey');
        const apiUrl = document.getElementById('apiUrl');
        const timeout = document.getElementById('timeout');
        const positivePrompt = document.getElementById('positivePrompt');
        const negativePrompt = document.getElementById('negativePrompt');
        const sampler = document.getElementById('sampler');
        const steps = document.getElementById('steps');
        const cfg = document.getElementById('cfg');
        const width = document.getElementById('width');
        const height = document.getElementById('height');
        const n = document.getElementById('n');
        const seed = document.getElementById('seed');
        const imagePreview = document.getElementById('imagePreview');
        const taskId = document.getElementById('taskId');
        const taskStatus = document.getElementById('taskStatus');
        const taskTime = document.getElementById('taskTime');
        const logArea = document.getElementById('logArea');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');

        // ============================================================
        //  2. 日志系统
        // ============================================================
        function addLog(message, level = 'info') {
            const time = new Date().toLocaleTimeString();
            const line = document.createElement('div');
            line.className = 'log-line';
            line.innerHTML = `<span class="time">[${time}]</span><span class="level-${level}">${message}</span>`;
            logArea.appendChild(line);
            logArea.scrollTop = logArea.scrollHeight;
        }

        function clearLog() {
            logArea.innerHTML = '';
            addLog('日志已清除', 'info');
        }

        // ============================================================
        //  3. Toast 提示
        // ============================================================
        function showToast(msg, type = 'info') {
            const old = document.querySelector('.toast');
            if (old) old.remove();
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // ============================================================
        //  4. 配置保存/加载
        // ============================================================
        function saveConfig() {
            const config = {
                apiKey: apiKey.value.trim(),
                apiUrl: apiUrl.value.trim(),
                timeout: parseInt(timeout.value) || 60,
                positivePrompt: positivePrompt.value.trim(),
                negativePrompt: negativePrompt.value.trim(),
                sampler: sampler.value,
                steps: parseInt(steps.value) || 28,
                cfg: parseFloat(cfg.value) || 7,
                width: parseInt(width.value) || 768,
                height: parseInt(height.value) || 768,
                n: parseInt(n.value) || 1
            };
            try {
                localStorage.setItem('novelai_config', JSON.stringify(config));
                showToast('💾 配置已保存', 'success');
            } catch (e) {
                showToast('❌ 保存失败', 'error');
            }
        }

        function loadConfig() {
            try {
                const raw = localStorage.getItem('novelai_config');
                if (!raw) return;
                const config = JSON.parse(raw);
                apiKey.value = config.apiKey || '';
                apiUrl.value = config.apiUrl || 'https://api.novelai.net/ai/generate-image';
                timeout.value = config.timeout || 60;
                positivePrompt.value = config.positivePrompt || '1girl, masterpiece, best quality, high resolution, detailed, fantasy art, beautiful';
                negativePrompt.value = config.negativePrompt || 'worst quality, low quality, blurry, ugly, deformed, bad anatomy';
                sampler.value = config.sampler || 'k_euler';
                steps.value = config.steps || 28;
                cfg.value = config.cfg || 7;
                width.value = config.width || 768;
                height.value = config.height || 768;
                n.value = config.n || 1;
                addLog('📥 配置已加载', 'info');
            } catch (e) {
                console.warn('加载配置失败:', e);
            }
        }

        // ============================================================
        //  5. NovelAI API 调用
        // ============================================================

        // 检测 API Key 有效性
        async function checkNovelAIStatus() {
            const key = apiKey.value.trim();
            if (!key) {
                statusDot.className = 'dot offline';
                statusText.textContent = '🔴 未配置 API Key';
                addLog('⚠️ 请先配置 NovelAI API Key', 'warn');
                return false;
            }

            statusDot.className = 'dot checking';
            statusText.textContent = '检测中...';

            try {
                // 简单测试：用很小的图测试 API 是否有效
                const testPrompt = 'test';
                const response = await fetch('https://api.novelai.net/ai/generate-image', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${key}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        prompt: testPrompt,
                        width: 64,
                        height: 64,
                        steps: 1,
                        sampler: 'k_euler',
                        cfg_scale: 1,
                        n: 1,
                        negative_prompt: 'test'
                    }),
                    signal: AbortSignal.timeout(10000)
                });

                if (response.status === 401) {
                    throw new Error('API Key 无效，请检查');
                } else if (response.status === 402) {
                    throw new Error('账户余额不足或需要订阅');
                } else if (response.status === 429) {
                    throw new Error('请求过于频繁，请稍后再试');
                } else if (response.ok || response.status === 400) {
                    // 400 表示参数错误，但说明 API Key 是有效的
                    statusDot.className = 'dot online';
                    statusText.textContent = '🟢 API Key 有效';
                    addLog('✅ NovelAI API Key 验证通过', 'success');
                    return true;
                } else {
                    throw new Error(`HTTP ${response.status}`);
                }
            } catch (error) {
                if (error.message.includes('API Key 无效')) {
                    statusDot.className = 'dot offline';
                    statusText.textContent = '🔴 API Key 无效';
                } else if (error.message.includes('余额') || error.message.includes('订阅')) {
                    statusDot.className = 'dot offline';
                    statusText.textContent = '🔴 账户余额不足';
                } else if (error.message.includes('频繁')) {
                    statusDot.className = 'dot offline';
                    statusText.textContent = '🔴 请求过于频繁';
                } else if (error.message.includes('Abort')) {
                    statusDot.className = 'dot offline';
                    statusText.textContent = '🔴 连接超时';
                } else {
                    statusDot.className = 'dot offline';
                    statusText.textContent = '🔴 连接失败';
                }
                addLog(`❌ 检测失败: ${error.message}`, 'error');
                return false;
            }
        }

        // 核心生图函数
        async function runNovelAITest() {
            if (isRunning) {
                showToast('⏳ 正在运行中，请等待', 'warn');
                return;
            }

            const key = apiKey.value.trim();
            if (!key) {
                showToast('⚠️ 请先配置 NovelAI API Key', 'error');
                return;
            }

            // 验证 API Key
            const isValid = await checkNovelAIStatus();
            if (!isValid) return;

            // 准备参数
            const positive = positivePrompt.value.trim() || 'masterpiece, best quality';
            const negative = negativePrompt.value.trim() || 'worst quality, blurry';
            const samplerVal = sampler.value;
            const stepsVal = parseInt(steps.value) || 28;
            const cfgVal = parseFloat(cfg.value) || 7;
            const widthVal = parseInt(width.value) || 768;
            const heightVal = parseInt(height.value) || 768;
            const nVal = parseInt(n.value) || 1;
            const seedVal = seed.value ? parseInt(seed.value) : undefined;

            const payload = {
                prompt: positive,
                width: widthVal,
                height: heightVal,
                steps: stepsVal,
                sampler: samplerVal,
                cfg_scale: cfgVal,
                n: nVal,
                negative_prompt: negative
            };

            if (seedVal !== undefined && !isNaN(seedVal)) {
                payload.seed = seedVal;
            }

            addLog(`📤 发送请求到 NovelAI`, 'info');
            addLog(`📝 提示词: ${positive.slice(0, 50)}...`, 'info');
            addLog(`📐 尺寸: ${widthVal}x${heightVal}, 步数: ${stepsVal}`, 'info');

            // 开始运行
            isRunning = true;
            document.getElementById('runTestBtn').disabled = true;
            document.getElementById('runTestBtn').textContent = '⏳ 运行中...';
            taskStatus.textContent = '生成中...';
            taskId.textContent = '-';
            taskTime.textContent = '-';

            // 显示加载动画
            imagePreview.innerHTML = `
                <div class="loading-overlay">
                    <div class="spinner"></div>
                    <div style="color:#ff6b9d;">⏳ 生成中...</div>
                </div>
            `;

            const startTime = Date.now();

            try {
                const response = await fetch(apiUrl.value.trim() || 'https://api.novelai.net/ai/generate-image', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${key}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload),
                    signal: AbortSignal.timeout((parseInt(timeout.value) || 60) * 1000)
                });

                if (!response.ok) {
                    let errorMsg = `HTTP ${response.status}`;
                    try {
                        const errorData = await response.json();
                        errorMsg = errorData.message || errorData.error || JSON.stringify(errorData);
                    } catch (e) {}
                    throw new Error(errorMsg);
                }

                // NovelAI 返回的是二进制图片数据
                const blob = await response.blob();
                const imageUrl = URL.createObjectURL(blob);

                // 显示图片
                imagePreview.innerHTML = `
                    <img src="${imageUrl}" alt="生成图片" style="max-width:100%;max-height:500px;object-fit:contain;border-radius:8px;">
                `;

                const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
                taskTime.textContent = `${elapsed}s`;
                taskStatus.textContent = '✅ 完成';
                addLog(`✅ 生成完成！耗时 ${elapsed}s`, 'success');
                showToast('✅ 生成成功！', 'success');

            } catch (error) {
                let errorMsg = error.message;
                if (error.name === 'AbortError' || errorMsg.includes('Abort')) {
                    errorMsg = '请求超时，请检查网络或增加超时时间';
                }
                taskStatus.textContent = '❌ 失败';
                addLog(`❌ 生成失败: ${errorMsg}`, 'error');
                showToast(`❌ 生成失败: ${errorMsg}`, 'error');
                imagePreview.innerHTML = `
                    <div class="placeholder">
                        <div style="font-size:32px;color:#f87171;">❌</div>
                        <div style="color:#f87171;">生成失败</div>
                        <div style="font-size:12px;color:#555;margin-top:4px;">${errorMsg}</div>
                    </div>
                `;
            } finally {
                isRunning = false;
                document.getElementById('runTestBtn').disabled = false;
                document.getElementById('runTestBtn').textContent = '▶ 运行测试';
                if (taskStatus.textContent === '生成中...') {
                    taskStatus.textContent = '⏹ 已停止';
                }
            }
        }

        // ============================================================
        //  6. 事件绑定
        // ============================================================

        // 检测状态
        document.getElementById('checkStatusBtn').addEventListener('click', checkNovelAIStatus);

        // 运行测试
        document.getElementById('runTestBtn').addEventListener('click', runNovelAITest);

        // 清除日志
        document.getElementById('clearLogBtn').addEventListener('click', clearLog);

        // 清除图片
        document.getElementById('clearImageBtn').addEventListener('click', () => {
            imagePreview.innerHTML = `
                <div class="placeholder">
                    <div style="font-size:32px;margin-bottom:8px;">🖼️</div>
                    <div>已清除</div>
                </div>
            `;
            taskId.textContent = '-';
            taskStatus.textContent = '就绪';
            taskTime.textContent = '-';
            addLog('🗑️ 图片已清除', 'info');
        });

        // 保存配置
        document.getElementById('saveConfigBtn').addEventListener('click', saveConfig);

        // Ctrl+Enter 快捷运行
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                e.preventDefault();
                runNovelAITest();
            }
        });

        // ============================================================
        //  7. 初始化
        // ============================================================

        loadConfig();
        addLog('🎨 NovelAI 测试工具已加载', 'info');
        addLog('💡 提示: Ctrl+Enter 快捷运行测试', 'info');

        // 如果有 API Key，自动检测
        if (apiKey.value.trim()) {
            setTimeout(checkNovelAIStatus, 800);
        } else {
            statusDot.className = 'dot offline';
            statusText.textContent = '🔴 未配置 API Key';
        }

        console.log('🎨 NovelAI 测试工具已加载');
        console.log('💡 使用方式:');
        console.log('  1. 输入 NovelAI API Key');
        console.log('  2. 配置生图参数');
        console.log('  3. 点击「运行测试」生成图片');
    </script>
</body>
</html>
